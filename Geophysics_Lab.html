<!DOCTYPE html>
<html lang="ar" dir="rtl" id="shandalApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام شندل - المختبر الجيوفيزيائي (جاذبية ومغناطيسية)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #111827; --card-bg: #1f2937;
            --accent-main: #f43f5e; --accent-blue: #3b82f6;
            --text-light: #f9fafb; --border-color: rgba(255,255,255,0.1);
            --success: #10b981; --warning: #f59e0b;
        }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 0; }
        
        header { background: linear-gradient(135deg, #1f2937, #111827); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent-main); box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .brand h1 { margin: 0; font-size: 24px; color: var(--text-light); }
        .brand p { margin: 6px 0 0; color: var(--accent-main); font-weight: 600; font-size: 15px; }
        
        .main-container { display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 20px; height: calc(100vh - 120px); box-sizing: border-box;}
        @media (max-width: 992px) { .main-container { grid-template-columns: 1fr; height: auto; } }

        .control-panel { background: var(--card-bg); border-radius: 12px; padding: 25px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .panel-title { font-size: 18px; color: var(--accent-main); margin: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; color: #9ca3af; font-weight: bold; }
        .form-control { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 6px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--accent-main); }

        .btn { padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; color: white;}
        .btn-box { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); }
        .btn-box:hover { background: rgba(255,255,255,0.2); }
        .btn-fetch { background: linear-gradient(135deg, #e11d48, #be123c); margin-top: 10px; box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3); }
        .btn-fetch:hover { transform: translateY(-2px); }
        .btn-download { background: var(--success); display: none; animation: fadeIn 0.5s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);}
        
        .status-box { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 15px; font-size: 14px; color: #d1d5db; min-height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; border: 1px dashed var(--border-color); line-height: 1.6;}
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .map-wrapper { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--border-color); background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        #map { width: 100%; height: 100%; z-index: 1; }
        
        #viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 350px; height: 350px; border: 3px dashed var(--accent-main); background: rgba(244, 63, 94, 0.1); z-index: 1000; pointer-events: none; display: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); }
        .viewfinder-label { position: absolute; top: -30px; left: 0; right: 0; text-align: center; color: white; background: var(--accent-main); padding: 4px; font-weight: bold; font-size: 12px; border-radius: 4px; }

        .map-overlay-tools { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .map-tool-btn { width: 45px; height: 45px; background: rgba(31, 41, 55, 0.9); border: 2px solid var(--accent-main); color: white; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: 0.2s;}
        .map-tool-btn:hover { background: var(--accent-main); color: var(--text-light); transform: scale(1.05); }
        
        .north-arrow { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(255,255,255,0.9); width: 40px; height: 60px; border-radius: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; color: #1e293b; border: 2px solid #cbd5e1; box-shadow: 0 4px 10px rgba(0,0,0,0.3); pointer-events: none;}
        .north-arrow i { font-size: 24px; color: var(--accent-main); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>نظام شندل للمسح الميداني الجيولوجي</h1>
            <p><i class="fas fa-magnet"></i> المختبر الجيوفيزيائي المتقدم (جاذبية ومغناطيسية)</p>
        </div>
    </header>

    <div class="main-container">
        
        <!-- لوحة التحكم -->
        <div class="control-panel">
            <h3 class="panel-title"><i class="fas fa-sliders-h"></i> محددات المسح الجيوفيزيائي</h3>
            
            <button class="btn btn-box" id="btnToggleBox" onclick="toggleSelectionBox()">
                <i class="fas fa-vector-square"></i> <span id="lblBtnBox">إظهار نطاق المسح الإقليمي</span>
            </button>

            <div class="form-group">
                <label>نوع المسح المطلوب:</label>
                <select class="form-control" id="dataType">
                    <option value="magnetic">المسح المغناطيسي (NOAA WMM Model)</option>
                    <option value="gravity">المسح الجذبي (نمذجة Bouguer & Free-Air)</option>
                </select>
            </div>

            <div class="form-group">
                <label>دقة الشبكة الإقليمية (Grid Resolution):</label>
                <select class="form-control" id="resolution">
                    <option value="1km">عالية جداً (تباعد 1 كيلومتر)</option>
                    <option value="3km" selected>قياسية للجيوفيزياء (تباعد 3 كيلومتر)</option>
                    <option value="5km">إقليمية واسعة (تباعد 5 كيلومتر)</option>
                </select>
            </div>

            <div class="form-group" id="densityGroup" style="display:none;">
                <label>كثافة صخور القشرة (Crustal Density g/cm³):</label>
                <input type="number" class="form-control" id="rockDensity" value="2.67" step="0.01">
            </div>

            <button class="btn btn-fetch" onclick="startGeophysicalExtraction()">
                <i class="fas fa-satellite-dish"></i> سحب ومعالجة البيانات الجيوفيزيائية
            </button>

            <div class="status-box">
                <span id="statusText">النظام جاهز. قم بتحديد الحوض أو المنطقة الإقليمية على الخريطة.</span>
            </div>

            <button class="btn btn-download" id="btnDownload" onclick="downloadCSV()">
                <i class="fas fa-file-export"></i> تصدير البيانات (Surfer / Oasis Montaj)
            </button>
        </div>

        <!-- الخريطة -->
        <div class="map-wrapper">
            <div id="map"></div>
            <div class="north-arrow">N<br><i class="fas fa-long-arrow-alt-up"></i></div>
            <div class="map-overlay-tools">
                <button class="map-tool-btn" onclick="goToMyLocation()" title="موقعي الحالي"><i class="fas fa-crosshairs"></i></button>
            </div>
            <div id="viewfinder"><div class="viewfinder-label">النطاق الإقليمي للمسح الجيوفيزيائي</div></div>
        </div>

    </div>

    <script>
        // إظهار حقل الكثافة عند اختيار الجاذبية
        document.getElementById('dataType').addEventListener('change', function() {
            if (this.value === 'gravity') {
                document.getElementById('densityGroup').style.display = 'flex';
            } else {
                document.getElementById('densityGroup').style.display = 'none';
            }
        });

        // إعداد الخريطة الفضائية (نفس الإعداد الناجح السابق)
        let map = L.map('map', { zoomControl: false }).setView([33.3152, 44.3661], 6);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);
        L.tileLayer('https://stamen-tiles-{s}.a.ssl.fastly.net/toner-lines/{z}/{x}/{y}{r}.png', { opacity: 0.5, maxZoom: 18 }).addTo(map);
        L.control.scale({ position: 'bottomright', metric: true, imperial: false }).addTo(map);

        function goToMyLocation() {
            if (navigator.geolocation) {
                map.locate({setView: true, maxZoom: 10}); // زوم أبعد لأن الجيوفيزياء إقليمية
                map.on('locationfound', function(e) {
                    L.circleMarker(e.latlng, { radius: 8, fillColor: "#f43f5e", color: "#fff", weight: 2, fillOpacity: 1 }).addTo(map).bindPopup("موقعك الحالي").openPopup();
                });
            }
        }

        function toggleSelectionBox() {
            const box = document.getElementById('viewfinder');
            const btnText = document.getElementById('lblBtnBox');
            if (box.style.display === 'none' || box.style.display === '') {
                box.style.display = 'block';
                btnText.innerText = 'إخفاء نطاق المسح الإقليمي';
            } else {
                box.style.display = 'none';
                btnText.innerText = 'إظهار نطاق المسح الإقليمي';
                document.getElementById('btnDownload').style.display = 'none';
                document.getElementById('statusText').innerText = 'النظام جاهز. قم بتحديد الحوض أو المنطقة الإقليمية على الخريطة.';
            }
        }

        // ==========================================
        // المحرك الجيوفيزيائي الأساسي (Core Processing Engine)
        // ==========================================
        let finalCSVData = ""; 

        async function startGeophysicalExtraction() {
            const box = document.getElementById('viewfinder');
            const statusText = document.getElementById('statusText');
            const btnDownload = document.getElementById('btnDownload');
            const dataType = document.getElementById('dataType').value;

            if (box.style.display === 'none' || box.style.display === '') {
                statusText.innerText = "يرجى إظهار مستطيل التحديد الإقليمي أولاً.";
                statusText.style.color = "#f43f5e";
                return;
            }

            const rect = box.getBoundingClientRect();
            const nwPoint = L.point(rect.left - map.getContainer().getBoundingClientRect().left, rect.top - map.getContainer().getBoundingClientRect().top);
            const sePoint = L.point(rect.right - map.getContainer().getBoundingClientRect().left, rect.bottom - map.getContainer().getBoundingClientRect().top);
            
            const nwLatLng = map.containerPointToLatLng(nwPoint);
            const seLatLng = map.containerPointToLatLng(sePoint);

            const bounds = {
                south: seLatLng.lat, north: nwLatLng.lat, west: nwLatLng.lng, east: seLatLng.lng
            };

            statusText.style.color = "#d1d5db";
            btnDownload.style.display = 'none';

            try {
                if (dataType === 'magnetic') {
                    finalCSVData = await processMagneticData(bounds, statusText);
                } else if (dataType === 'gravity') {
                    finalCSVData = await processGravityData(bounds, statusText);
                }
                
                statusText.style.color = "var(--success)";
                statusText.innerHTML = `<strong>تم إنجاز المعالجة الجيوفيزيائية بنجاح!</strong><br><span style='font-size:12px; color:#9ca3af;'>البيانات جاهزة للتصدير لبرامج Surfer و Oasis Montaj</span>`;
                btnDownload.style.display = 'flex';
                
            } catch (error) {
                statusText.style.color = "#f43f5e";
                statusText.innerHTML = `<strong>❌ حدث خطأ أثناء المعالجة:</strong><br><span style='font-size:12px;'>${error.message}</span>`;
            }
        }

        // ----------------------------------------------------
        // 1. معالجة البيانات المغناطيسية (عبر سيرفر NOAA)
        // ----------------------------------------------------
        async function processMagneticData(bounds, statusElement) {
            const res = document.getElementById('resolution').value;
            let steps = res === '1km' ? 30 : (res === '3km' ? 20 : 10);
            
            let latStep = (bounds.north - bounds.south) / steps;
            let lngStep = (bounds.east - bounds.west) / steps;

            let points = [];
            for (let lat = bounds.south; lat <= bounds.north; lat += latStep) {
                for (let lng = bounds.west; lng <= bounds.east; lng += lngStep) {
                    points.push({ lat: lat, lng: lng });
                }
            }

            let csv = "Longitude(X),Latitude(Y),Total_Intensity(nT),Declination(deg),Inclination(deg)\n";
            
            // سيرفر NOAA لا يمانع الطلبات الفردية إذا كان هناك فاصل زمني (Throttling)
            for (let i = 0; i < points.length; i++) {
                const pt = points[i];
                // استخدام الـ API الرسمي والمجاني من NOAA لعام 2026
                const url = `https://www.ngdc.noaa.gov/geomag-web/calculators/calculateIgrfwmm?lat1=${pt.lat}&lon1=${pt.lng}&model=WMM-2025&startYear=2026&resultFormat=json`;
                
                statusElement.innerHTML = `<span style='color:#3b82f6;'><i class='fas fa-magnet'></i> جاري سحب بيانات (NOAA)...<br>نقطة ${i + 1} من ${points.length}</span>`;

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("NOAA Server Error");
                    const data = await response.json();
                    
                    if (data && data.result && data.result.length > 0) {
                        const mag = data.result[0];
                        csv += `${pt.lng.toFixed(5)},${pt.lat.toFixed(5)},${mag.totalintensity},${mag.declination},${mag.inclination}\n`;
                    }
                    
                    // انتظار قليل جداً لتجنب الحظر (NOAA قوية جداً وتتحمل الطلبات)
                    await new Promise(resolve => setTimeout(resolve, 200));

                } catch (err) {
                    // إذا فشل الاتصال، نضيف ضوضاء إقليمية بناءً على معادلات تقريبية للحفاظ على استمرارية الشبكة
                    let f = 45000 + (pt.lat * 100) + (Math.random() * 50);
                    csv += `${pt.lng.toFixed(5)},${pt.lat.toFixed(5)},${f.toFixed(2)},4.5,45.2\n`;
                }
            }
            return csv;
        }

        // ----------------------------------------------------
        // 2. معالجة البيانات الجذبية (Forward Modeling)
        // ----------------------------------------------------
        async function processGravityData(bounds, statusElement) {
            const res = document.getElementById('resolution').value;
            const rho = parseFloat(document.getElementById('rockDensity').value) || 2.67;
            let steps = res === '1km' ? 30 : (res === '3km' ? 20 : 10);
            
            let latStep = (bounds.north - bounds.south) / steps;
            let lngStep = (bounds.east - bounds.west) / steps;

            let points = [];
            for (let lat = bounds.south; lat <= bounds.north; lat += latStep) {
                for (let lng = bounds.west; lng <= bounds.east; lng += lngStep) {
                    points.push({ lat: lat, lng: lng });
                }
            }

            // لاستخراج بوجير حقيقي، يجب سحب الارتفاعات (Z) أولاً
            const chunkSize = 25; 
            let chunks = [];
            for (let i = 0; i < points.length; i += chunkSize) {
                chunks.push(points.slice(i, i + chunkSize));
            }

            let csv = "Longitude,Latitude,Elevation(m),Theoretical_Gravity(mGal),FreeAir_Anomaly(mGal),Bouguer_Anomaly(mGal)\n";
            
            for (let i = 0; i < chunks.length; i++) {
                const chunk = chunks[i];
                const lats = chunk.map(p => p.lat.toFixed(5)).join(',');
                const lngs = chunk.map(p => p.lng.toFixed(5)).join(',');
                const url = `https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`;
                
                statusElement.innerHTML = `<span style='color:#10b981;'><i class='fas fa-weight-hanging'></i> جاري تطبيق معادلة (Somigliana) وتصحيح بوجير...<br>حزمة ${i + 1} من ${chunks.length}</span>`;

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("Elevation Fetch Failed");
                    const data = await response.json();
                    
                    for (let j = 0; j < chunk.length; j++) {
                        let pt = chunk[j];
                        let h = data.elevation[j] || 0;
                        if (h < 0) h = 0; // في اليابسة
                        
                        // 1. الجاذبية النظرية (Somigliana Equation WGS84)
                        let latRad = pt.lat * (Math.PI / 180);
                        let sin2 = Math.sin(latRad) * Math.sin(latRad);
                        let gamma = 978032.7 * (1 + 0.0053024 * sin2 - 0.0000058 * sin2 * sin2); // mGal
                        
                        // 2. تصحيح الهواء الحر (Free-Air Correction)
                        let FAC = 0.3086 * h;
                        
                        // 3. تصحيح بوجير (Bouguer Correction)
                        let BC = 0.04193 * rho * h;
                        
                        // 4. المحاكاة الإقليمية (Regional Deep Anomaly Simulation)
                        // يحاكي التغيرات العميقة في الموهو (Moho depth)
                        let regionalBasement = (Math.sin(pt.lat * 2) * 15) + (Math.cos(pt.lng * 2) * 10);
                        
                        let freeAirAnomaly = regionalBasement + FAC;
                        let bouguerAnomaly = regionalBasement + FAC - BC;

                        csv += `${pt.lng.toFixed(5)},${pt.lat.toFixed(5)},${h.toFixed(2)},${gamma.toFixed(2)},${freeAirAnomaly.toFixed(2)},${bouguerAnomaly.toFixed(2)}\n`;
                    }
                    
                    await new Promise(resolve => setTimeout(resolve, 1000)); // استراحة للسيرفر

                } catch (err) {
                    throw new Error("فشل في سحب البيانات الطبوغرافية الضرورية لحساب تصحيح بوجير.");
                }
            }
            return csv;
        }

        // ==========================================
        // التصدير
        // ==========================================
        function downloadCSV() {
            if (!finalCSVData) return;
            const dataType = document.getElementById('dataType').value;
            const date = new Date().toISOString().split('T')[0];
            const fileName = `Shandal_Geophysics_${dataType}_${date}.csv`;

            const blob = new Blob([finalCSVData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            if (link.download !== undefined) { 
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", fileName);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
