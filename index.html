<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام راسانة - التوثيق الجيولوجي للمقالع</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --accent: #2980b9; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; color: #333; }
        .container { background: white; max-width: 700px; margin: auto; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; border-top: 8px solid var(--primary); }
        header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        header h1 { margin: 0; font-size: 1.4rem; }
        header p { margin: 5px 0 0; opacity: 0.8; font-size: 0.9rem; }
        .content { padding: 20px; }
        .section { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: right; }
        h3 { color: var(--accent); border-right: 4px solid var(--accent); padding-right: 10px; margin-top: 0; }
        
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.3s; color: white; }
        .btn-gps { background-color: var(--secondary); }
        .btn-calc { background-color: var(--accent); }
        .btn-save { background-color: #f39c12; }
        .btn-download { background-color: #8e44ad; }
        button:active { transform: scale(0.98); opacity: 0.9; }

        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        .coord-box { background: #ecf0f1; padding: 10px; border-radius: 5px; margin: 5px 0; font-family: monospace; font-size: 0.85rem; border-right: 3px solid var(--secondary); }
        #results { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; line-height: 1.8; }
        
        canvas { background: white; border: 2px solid var(--primary); width: 100%; height: auto; border-radius: 8px; margin-top: 15px; }
        footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>نظام التوثيق الجيولوجي للمقالع</h1>
        <p>بإشراف الجيولوجي: علي شندل فلاح</p>
    </header>

    <div class="content">
        <div class="section">
            <h3>1. إحداثيات الموقع (GPS)</h3>
            <p style="font-size: 0.8rem; color: #666;">قف عند كل زاوية واضغط الزر المقابل:</p>
            <button class="btn-gps" onclick="fetchGPS(1)">التقاط الزاوية A</button>
            <div id="c1" class="coord-box">N: -- | E: --</div>
            <button class="btn-gps" onclick="fetchGPS(2)">التقاط الزاوية B</button>
            <div id="c2" class="coord-box">N: -- | E: --</div>
            <button class="btn-gps" onclick="fetchGPS(3)">التقاط الزاوية C</button>
            <div id="c3" class="coord-box">N: -- | E: --</div>
            <button class="btn-gps" onclick="fetchGPS(4)">التقاط الزاوية D</button>
            <div id="c4" class="coord-box">N: -- | E: --</div>
        </div>

        <div class="section">
            <h3>2. الحسابات والكميات</h3>
            <label>المساحة الكلية (متر مربع):</label>
            <input type="number" id="totalArea" placeholder="مثلاً: 3750 أو 7500">
            
            <label>عمق الحفر الحالي (متر):</label>
            <input type="number" id="depth" placeholder="أدخل العمق بالمتر">
            
            <label>المساحة المستثمرة حالياً (متر مربع):</label>
            <input type="number" id="invArea" placeholder="المساحة المحفورة فعلياً">

            <label>لون تمثيل المنطقة في الرسم:</label>
            <input type="color" id="fieldColor" value="#e74c3c">

            <button class="btn-calc" onclick="processData()">حساب النتائج وتوليد المخطط</button>
            <div id="results"></div>
        </div>

        <div class="section">
            <h3>3. المخطط الهندسي (Top View)</h3>
            <canvas id="mainCanvas" width="500" height="300"></canvas>
            <button class="btn-download" onclick="exportImage()">تحميل المخطط كصورة PNG</button>
            <button class="btn-save" onclick="saveData()">حفظ المسودة في الهاتف</button>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة لخدمة "رسانة" - 2026
    </footer>
</div>

<script>
    let savedCoords = {};

    // 1. GPS Fetching Logic
    function fetchGPS(num) {
        if (!navigator.geolocation) return alert("متصفحك لا يدعم نظام GPS");
        
        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude.toFixed(6);
            const lon = pos.coords.longitude.toFixed(6);
            document.getElementById(`c${num}`).innerText = `N: ${lat}° | E: ${lon}°`;
            savedCoords[num] = { lat, lon };
        }, (err) => alert("يرجى تفعيل الموقع (GPS) والسماح للمتصفح بالوصول"), 
        { enableHighAccuracy: true });
    }

    // 2. Calculations & UI Update
    function processData() {
        const total = parseFloat(document.getElementById('totalArea').value);
        const depth = parseFloat(document.getElementById('depth').value);
        const inv = parseFloat(document.getElementById('invArea').value);

        if (!total || !depth || !inv) return alert("يرجى ملء كافة الحقول الحسابية");

        const extVol = (inv * depth).toFixed(2);
        const remArea = (total - inv).toFixed(2);
        const remVol = (remArea * depth).toFixed(2);

        const res = document.getElementById('results');
        res.style.display = "block";
        res.innerHTML = `
            <strong>النتائج النهائية للموقع:</strong><br>
            • الكمية المستخرجة فعلياً: <b>${extVol} م³</b><br>
            • المساحة المتبقية للاستثمار: <b>${remArea} م²</b><br>
            • الكمية المتبقية المتوقعة: <b>${remVol} م³</b>
        `;

        renderPlot(total, inv);
    }

    // 3. Drawing Logic (Canvas)
    function renderPlot(total, inv) {
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const color = document.getElementById('fieldColor').value;

        // Clear and Draw Grid
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#eee";
        for(let i=0; i<canvas.width; i+=25) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let j=0; j<canvas.height; j+=25) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

        // Draw Total Boundary
        ctx.strokeStyle = "#2c3e50";
        ctx.lineWidth = 4;
        ctx.strokeRect(50, 50, 400, 200);
        ctx.fillStyle = "#f8f9fa";
        ctx.fillRect(50, 50, 400, 200);

        // Draw Invested Area (Ratio Based)
        let ratio = inv / total;
        if(ratio > 1) ratio = 1;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.6;
        ctx.fillRect(50, 50, 400 * ratio, 200);
        ctx.globalAlpha = 1.0;

        // Labels
        ctx.fillStyle = "#333";
        ctx.font = "bold 12px Arial";
        ctx.fillText("مخطط المساحة (X, Y)", 200, 30);
        ctx.fillText("المساحة الكلية", 50, 45);
    }

    // 4. Persistence & Export
    function saveData() {
        const payload = {
            t: document.getElementById('totalArea').value,
            d: document.getElementById('depth').value,
            i: document.getElementById('invArea').value,
            coords: savedCoords
        };
        localStorage.setItem('GeoData_Nahrawan', JSON.stringify(payload));
        alert("تم حفظ البيانات في ذاكرة الهاتف. يمكنك استعادتها حتى بدون إنترنت.");
    }

    function exportImage() {
        const canvas = document.getElementById('mainCanvas');
        const link = document.createElement('a');
        link.download = `Nahrawan_Report_${new Date().toLocaleDateString()}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }

    // Load saved data on startup
    window.onload = () => {
        const data = JSON.parse(localStorage.getItem('GeoData_Nahrawan'));
        if(data) {
            document.getElementById('totalArea').value = data.t;
            document.getElementById('depth').value = data.d;
            document.getElementById('invArea').value = data.i;
            alert("تم استعادة آخر بيانات محفوظة تلقائياً.");
        }
    };
</script>

</body>
</html>
