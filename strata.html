<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shandal System - Advanced Stratigraphic Column Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b1329;
            --card-bg: #1c2541;
            --accent-gold: #ffb703;
            --accent-blue: #00b4d8;
            --text-light: #f8fafc;
            --border-glow: rgba(0, 180, 216, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        header {
            background: linear-gradient(135deg, #1c2541, #0b1329);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .brand h1 { margin: 0; font-size: 24px; letter-spacing: 1px; color: var(--text-light); }
        .brand p { margin: 5px 0 0; color: var(--accent-blue); font-weight: 500; }

        .lang-btn {
            background: transparent;
            border: 2px solid var(--accent-blue);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .lang-btn:hover { background: var(--accent-blue); color: var(--bg-dark); }

        .app-container {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 25px;
            max-width: 1500px;
            margin: 30px auto;
            padding: 0 20px;
        }

        @media (max-width: 1024px) { .app-container { grid-template-columns: 1fr; } }

        .control-panel, .output-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .section-title {
            font-size: 18px;
            color: var(--accent-gold);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        
        .form-control {
            width: 100%;
            padding: 12px;
            background: rgba(11, 19, 41, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .form-control:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 10px var(--border-glow); }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
        }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, #00b4d8, #0077b6); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 180, 216, 0.4); }
        .btn-secondary { background: #3a0ca3; color: white; margin-top: 10px; }
        .btn-danger { background: #d90429; color: white; margin-top: 10px; }

        /* منطقة الرسم الحقيقي للعمود */
        .canvas-holder {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            text-align: center;
        }
        canvas { background: #ffffff; max-width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* النماذج الترجمية والتحكم اللغوي بالاتجاهات */
        [dir="rtl"] .lang-btn i { transform: rotate(180deg); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1 id="txt-main-title">Shandal System for Geological Field Survey</h1>
            <p id="txt-sub-title"><i class="fas fa-cubes"></i> Modern Stratigraphic Column Laboratory</p>
        </div>
        <button class="lang-btn" onclick="toggleLanguage()">
            <span id="btn-lang-text">العربية</span> <i class="fas fa-exchange-alt"></i>
        </button>
    </header>

    <div class="app-container">
        <div class="control-panel">
            <h3 class="section-title"><i class="fas fa-sliders-h"></i> <span id="lbl-inputs">Lithological Inputs</span></h3>
            
            <div class="form-group">
                <label id="lbl-formation">Formation / Era Name:</label>
                <input type="text" id="inp-formation" class="form-control" placeholder="e.g., Dammam Formation">
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label id="lbl-main-cat">Primary Classification:</label>
                    <select id="sel-main-cat" class="form-control" onchange="updateSubCategories()">
                        <option value="Sedimentary">Sedimentary (رسوبية)</option>
                        <option value="Igneous">Igneous (نارية)</option>
                        <option value="Metamorphic">Metamorphic (متحولة)</option>
                        <option value="Evaporites">Evaporites (متبخرات)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl-sub-cat">Rock Type (Lithology):</label>
                    <select id="sel-sub-cat" class="form-control"></select>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="chk-interbedded" onchange="toggleInterbeddedStyle()">
                <label for="chk-interbedded" id="lbl-has-interbed" style="margin:0; color:#fff; cursor:pointer;">Contains Interbedded / Mixed Lithology</label>
            </div>

            <div id="interbedded-panel" style="display: none; border-left: 3px solid var(--accent-gold); padding-left: 12px; margin-bottom: 18px;">
                <div class="grid-2">
                    <div class="form-group">
                        <label id="lbl-sec-cat">Secondary Component:</label>
                        <select id="sel-sec-cat" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label id="lbl-mix-type">Bedding Relationship:</label>
                        <select id="sel-mix-type" class="form-control">
                            <option value="interbedded">Interbedded (تعاقب طباقي)</option>
                            <option value="mixed">Mixed / Gradational (تداخل مشترك)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label id="lbl-thickness">Bed Thickness (Meters):</label>
                    <input type="number" id="inp-thickness" class="form-control" value="5" min="0.5" step="0.5">
                </div>
                <div class="form-group">
                    <label id="lbl-hardness">Weathering Profile (Hardness 1-5):</label>
                    <input type="number" id="inp-hardness" class="form-control" value="3" min="1" max="5">
                </div>
            </div>

            <button class="btn btn-primary" onclick="addGeologicalLayer()"><i class="fas fa-layer-group"></i> <span id="btn-add">Plot Layer</span></button>
            <button class="btn btn-secondary" onclick="exportLogImage()"><i class="fas fa-file-download"></i> <span id="btn-export">Export Chart (PNG)</span></button>
            <button class="btn btn-danger" onclick="clearLog()"><i class="fas fa-trash-alt"></i> <span id="btn-clear">Reset Lab</span></button>
        </div>

        <div class="output-panel">
            <h3 class="section-title"><i class="fas fa-chart-area"></i> <span id="lbl-output-title">Stratigraphic Log Output</span></h3>
            <div class="canvas-holder">
                <canvas id="geoCanvas" width="750" height="500"></canvas>
            </div>
        </div>
    </div>

    <script>
        // قاعدة البيانات الجيولوجية للمسوحات في نظام شندل
        const geoDatabase = {
            Sedimentary: ["Shale", "Sandstone", "Limestone", "Claystone", "Siltstone", "Conglomerate", "Breccia", "Marl"],
            Igneous: ["Basalt", "Granite", "Gabbro", "Obsidian", "Rhyolite"],
            Metamorphic: ["Schist", "Gneiss", "Marble", "Quartzite", "Slate"],
            Evaporites: ["Gypsum", "Anhydrite", "Halite"]
        };

        // الرموز اللونية الجيولوجية القياسية (USGS Colors)
        const geoColors = {
            Sandstone: "#fef08a", Shale: "#94a3b8", Limestone: "#93c5fd", Claystone: "#cbd5e1",
            Siltstone: "#fca5a5", Conglomerate: "#f97316", Breccia: "#ea580c", Marl: "#a7f3d0",
            Basalt: "#475569", Granite: "#f472b6", Gypsum: "#e2e8f0", Anhydrite: "#f1f5f9", Halite: "#ffffff"
        };

        let currentLang = "en";
        let stratigraphicLayers = [];
        
        const canvas = document.getElementById('geoCanvas');
        const ctx = canvas.getContext('2d');

        const dict = {
            en: {
                mainTitle: "Shandal System for Geological Field Survey", subTitle: "Modern Stratigraphic Column Laboratory",
                inputs: "Lithological Inputs", formation: "Formation / Era Name:", mainCat: "Primary Classification:",
                subCat: "Rock Type (Lithology):", hasInterbed: "Contains Interbedded / Mixed Lithology",
                secCat: "Secondary Component:", mixType: "Bedding Relationship:", thickness: "Bed Thickness (Meters):",
                hardness: "Weathering Profile (Hardness 1-5):", add: "Plot Layer", export: "Export Chart (PNG)",
                clear: "Reset Lab", outputTitle: "Stratigraphic Log Output"
            },
            ar: {
                mainTitle: "نظام شندل للمسح الميداني الجيولوجي", subTitle: "المختبر الحديث للعمود الطباقي الجيولوجي",
                inputs: "المدخلات الصخرية والطباقية", formation: "اسم التكوين / العصر الجيولوجي:", mainCat: "التصنيف الرئيسي الصخري:",
                subCat: "نوع الصخر (Lithology):", hasInterbed: "تحتوي الطبقة على تداخل / تعاقب مشترك",
                secCat: "المكون الثانوي:", mixType: "نوع التعاقد والتداخل:", thickness: "سمك الطبقة (بالأمتار):",
                hardness: "بروفايل التجوية (الصلابة 1-5):", add: "إسقاط ورسم الطبقة", export: "تصدير المخطط (PNG)",
                clear: "إعادة تهيئة المختبر", outputTitle: "لوحة مخرجات المخطط الطباقي العلمي"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === "en" ? "ar" : "en";
            const html = document.getElementById('htmlPage');
            html.setAttribute('dir', currentLang === "ar" ? "rtl" : "ltr");
            html.setAttribute('lang', currentLang);
            document.getElementById('btn-lang-text').innerText = currentLang === "ar" ? "English" : "العربية";
            
            // تحديث النصوص الواجهية
            document.getElementById('txt-main-title').innerText = dict[currentLang].mainTitle;
            document.getElementById('txt-sub-title').innerHTML = `<i class="fas fa-cubes"></i> ${dict[currentLang].subTitle}`;
            document.getElementById('lbl-inputs').innerText = dict[currentLang].inputs;
            document.getElementById('lbl-formation').innerText = dict[currentLang].formation;
            document.getElementById('lbl-main-cat').innerText = dict[currentLang].mainCat;
            document.getElementById('lbl-sub-cat').innerText = dict[currentLang].subCat;
            document.getElementById('lbl-has-interbed').innerText = dict[currentLang].hasInterbed;
            document.getElementById('lbl-sec-cat').innerText = dict[currentLang].secCat;
            document.getElementById('lbl-mix-type').innerText = dict[currentLang].mixType;
            document.getElementById('lbl-thickness').innerText = dict[currentLang].thickness;
            document.getElementById('lbl-hardness').innerText = dict[currentLang].hardness;
            document.getElementById('btn-add').innerText = dict[currentLang].add;
            document.getElementById('btn-export').innerText = dict[currentLang].export;
            document.getElementById('btn-clear').innerText = dict[currentLang].clear;
            document.getElementById('lbl-output-title').innerText = dict[currentLang].outputTitle;
            
            drawStratigraphicColumn();
        }

        function updateSubCategories() {
            const mainCat = document.getElementById('sel-main-cat').value;
            const subSelect = document.getElementById('sel-sub-cat');
            const secSelect = document.getElementById('sel-sec-cat');
            
            subSelect.innerHTML = "";
            secSelect.innerHTML = "";

            geoDatabase[mainCat].forEach(rock => {
                subSelect.innerHTML += `<option value="${rock}">${rock}</option>`;
                secSelect.innerHTML += `<option value="${rock}">${rock}</option>`;
            });
        }

        function toggleInterbeddedStyle() {
            const isChecked = document.getElementById('chk-interbedded').checked;
            document.getElementById('interbedded-panel').style.display = isChecked ? 'block' : 'none';
        }

        function addGeologicalLayer() {
            const layer = {
                formation: document.getElementById('inp-formation').value || "Unknown Fm.",
                primary: document.getElementById('sel-sub-cat').value,
                isInterbed: document.getElementById('chk-interbedded').checked,
                secondary: document.getElementById('sel-sec-cat').value,
                mixStyle: document.getElementById('sel-mix-type').value,
                thickness: parseFloat(document.getElementById('inp-thickness').value) || 1,
                hardness: parseInt(document.getElementById('inp-hardness').value) || 3
            };

            // الإضافة من الأعلى للأسفل ليعكس منطق حوض الترسيب
            stratigraphicLayers.unshift(layer);
            drawStratigraphicColumn();
        }

        // محرك الرسم الجيولوجي التكنولوجي المطور
        function drawStratigraphicColumn() {
            // تنظيف وخلق مساحة اللوحة بشكل ديناميكي
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ترويسة اللوحة العلمية
            ctx.fillStyle = "#0b1329";
            ctx.font = "bold 16px 'Segoe UI', Arial";
            ctx.fillText(currentLang === "ar" ? "نظام شندل - السجل الطباقي النموذجي العام" : "SHANDAL SYSTEM - STANDARD STRATIGRAPHIC LOG", 40, 40);
            
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(30, 70, canvas.width - 60, canvas.height - 100);

            // خطوط التقسيم الفنية للـ Log Tracks
            let trackX_Fm = 150;
            let trackX_Col = 380;
            let trackX_Thick = 450;

            ctx.beginPath();
            ctx.moveTo(trackX_Fm, 70); ctx.lineTo(trackX_Fm, canvas.height - 30);
            ctx.moveTo(trackX_Col, 70); ctx.lineTo(trackX_Col, canvas.height - 30);
            ctx.moveTo(trackX_Thick, 70); ctx.lineTo(trackX_Thick, canvas.height - 30);
            ctx.stroke();

            // العناوين للأعمدة
            ctx.font = "bold 12px Arial";
            ctx.fillText(currentLang === "ar" ? "التكوين / العصر" : "Formation / Age", 45, 90);
            ctx.fillText(currentLang === "ar" ? "العمود اللوجي والصلابة" : "Lithology / Hardness", trackX_Fm + 20, 90);
            ctx.fillText(currentLang === "ar" ? "السمك" : "Thick.", trackX_Col + 10, 90);
            ctx.fillText(currentLang === "ar" ? "الوصف الجيولوجي الدليل" : "Geological Description & Legend", trackX_Thick + 20, 90);

            let currentY = 110;
            let availableHeight = canvas.height - 140;
            let totalThick = stratigraphicLayers.reduce((s, l) => s + l.thickness, 0) || 1;
            let scaleFactor = availableHeight / totalThick;

            stratigraphicLayers.forEach(l => {
                let bedHeight = l.thickness * scaleFactor;
                let cColor = geoColors[l.primary] || "#cbd5e1";

                // رسم بروفايل الصلابة (السمك الجانبي المتغير تكتونياً وجيولوجياً)
                let baseWidth = 130;
                let dynamicWidth = baseWidth + (l.hardness * 14);

                // رسم المكون الصخري الأساسي
                ctx.fillStyle = cColor;
                ctx.fillRect(trackX_Fm + 5, currentY, dynamicWidth, bedHeight);
                ctx.strokeRect(trackX_Fm + 5, currentY, dynamicWidth, bedHeight);

                // معالجة ورسم التداخل والتعاقب (Interbedded) بخطوط هندسية مائلة جيولوجية حقيقية
                if (l.isInterbed) {
                    ctx.fillStyle = geoColors[l.secondary] || "#94a3b8";
                    if (l.mixStyle === "interbedded") {
                        // رسم تعاقب طباقي خطي مائل دقيق يمثل التناوب الطبقي
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(trackX_Fm + 5, currentY, dynamicWidth, bedHeight);
                        ctx.clip();
                        
                        ctx.beginPath();
                        for (let offset = -bedHeight; offset < dynamicWidth; offset += 15) {
                            ctx.moveTo(trackX_Fm + 5 + offset, currentY);
                            ctx.lineTo(trackX_Fm + 5 + offset + 15, currentY + bedHeight);
                        }
                        ctx.strokeStyle = "rgba(0,0,0,0.4)";
                        ctx.lineWidth = 4;
                        ctx.stroke();
                        ctx.restore();
                    } else {
                        // تداخل ممتزج تدريجي (Gradational)
                        ctx.fillStyle = "rgba(0,0,0,0.15)";
                        ctx.fillRect(trackX_Fm + 5, currentY + (bedHeight/2), dynamicWidth, bedHeight/2);
                    }
                }

                // كتابة النصوص الجيولوجية والسمك داخل التراك المخصص لها
                ctx.fillStyle = "#000000";
                ctx.font = "11px Arial";
                ctx.fillText(l.formation, 40, currentY + (bedHeight/2) + 4);
                ctx.fillText(l.thickness + " m", trackX_Col + 10, currentY + (bedHeight/2) + 4);
                
                let descText = l.isInterbed ? `${l.primary} with ${l.secondary}` : l.primary;
                ctx.fillText(descText, trackX_Thick + 15, currentY + (bedHeight/2) + 4);

                currentY += bedHeight;
            });
        }

        function exportLogImage() {
            const link = document.createElement('a');
            link.download = 'Shandal_Geological_Log.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function clearLog() {
            stratigraphicLayers = [];
            drawStratigraphicColumn();
        }

        // الإقلاع الأولي للبرنامج
        updateSubCategories();
        drawStratigraphicColumn();
    </script>
</body>
</html>
