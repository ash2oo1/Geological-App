<!DOCTYPE html>
<html lang="en" dir="ltr" id="shandalApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shandal System - Modern Stratigraphic Column</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0f1d; --card-bg: #141d36;
            --accent-gold: #f59e0b; --accent-blue: #0ea5e9;
            --text-light: #f8fafc; --border-color: rgba(255,255,255,0.08);
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 0; transition: all 0.3s ease; }
        header { background: linear-gradient(135deg, #141d36, #0a0f1d); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent-gold); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .brand h1 { margin: 0; font-size: 24px; color: var(--text-light); letter-spacing: 0.5px; }
        .brand p { margin: 6px 0 0; color: var(--accent-blue); font-weight: 600; font-size: 15px; }
        .lang-toggle { background: rgba(14, 165, 233, 0.15); border: 2px solid var(--accent-blue); color: var(--text-light); padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .lang-toggle:hover { background: var(--accent-blue); color: var(--bg-dark); }
        
        .main-container { display: grid; grid-template-columns: 420px 1fr; gap: 30px; max-width: 1600px; margin: 30px auto; padding: 0 25px; }
        @media (max-width: 1100px) { .main-container { grid-template-columns: 1fr; } }
        
        .panel { background: var(--card-bg); border-radius: 12px; padding: 25px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .panel-title { font-size: 17px; color: var(--accent-gold); margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .form-control { width: 100%; padding: 11px; background: rgba(10, 15, 29, 0.7); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: var(--accent-blue); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .checkbox-card { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; margin-bottom: 16px; }
        .checkbox-card input { width: 18px; height: 18px; cursor: pointer; }
        
        .btn { width: 100%; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-add { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14,165,233,0.3); }
        .btn-export { background: #0d9488; color: white; margin-top: 10px; }
        .btn-clear { background: #e11d48; color: white; margin-top: 10px; }
        
        .canvas-area { background: #ffffff; border-radius: 8px; padding: 25px; overflow-x: auto; text-align: center; }
        canvas { background: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 100%; }
        
        [dir="rtl"] .lang-toggle i { transform: rotate(180deg); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1 id="app-title">Shandal System for Geological Field Survey</h1>
            <p id="app-subtitle"><i class="fas fa-layer-group"></i> Modern Stratigraphic Column Laboratory</p>
        </div>
        <button class="lang-toggle" onclick="swapLanguage()">
            <span id="lang-btn-text">العربية</span> <i class="fas fa-arrow-right"></i>
        </button>
    </header>

    <div class="main-container">
        <div class="panel">
            <h3 class="panel-title"><i class="fas fa-edit"></i> <span id="lbl-panel-inputs">Geological Settings</span></h3>
            
            <div class="grid-2">
                <div class="form-group">
                    <label id="lbl-formation">Formation Name:</label>
                    <input type="text" id="in-formation" class="form-control" placeholder="e.g., Dammam">
                </div>
                <div class="form-group">
                    <label id="lbl-age">Geological Age (Optional):</label>
                    <input type="text" id="in-age" class="form-control" placeholder="e.g., Eocene">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label id="lbl-litho-type">Lithology Type:</label>
                    <select id="sel-litho-type" class="form-control" onchange="loadRockTypes()">
                        <option value="Sedimentary">Sedimentary (رسوبية)</option>
                        <option value="Igneous">Igneous (نارية)</option>
                        <option value="Metamorphic">Metamorphic (متحولة)</option>
                        <option value="Evaporites">Evaporites (متبخرات)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl-rock-name">Rock Name:</label>
                    <select id="sel-rock-name" class="form-control"></select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label id="lbl-bg-color">Rock Base Color:</label>
                    <input type="color" id="in-bg-color" class="form-control" value="#fef08a" style="padding:0; height:40px;">
                </div>
                <div class="form-group">
                    <label id="lbl-pattern-color">Hatch/Pattern Color:</label>
                    <input type="color" id="in-pattern-color" class="form-control" value="#475569" style="padding:0; height:40px;">
                </div>
            </div>

            <div class="checkbox-card">
                <input type="checkbox" id="chk-has-interbed" onchange="toggleInterbedRow()">
                <label for="chk-has-interbed" id="lbl-chk-interbed" style="margin:0; color:#fff; cursor:pointer;">Has Interbedded Component</label>
            </div>

            <div id="row-interbed" style="display: none; background: rgba(0,0,0,0.15); padding: 15px; border-radius: 6px; margin-bottom:16px;">
                <div class="grid-2">
                    <div class="form-group">
                        <label id="lbl-sec-rock">Secondary Rock:</label>
                        <select id="sel-sec-rock" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label id="lbl-interbed-style">Relationship Style:</label>
                        <select id="sel-interbed-style" class="form-control">
                            <option value="interbedded">Interbedded (تعاقب)</option>
                            <option value="mixed">Mixed Lithology (تداخل مشترك)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label id="lbl-contact">Bottom Bed Contact:</label>
                <select id="sel-contact" class="form-control">
                    <option value="sharp">Sharp / Planar (حد فاصل مستقيم)</option>
                    <option value="erosional">Erosional / Unconformity (حد تعريتي متعرج)</option>
                    <option value="gradational">Gradational (حد فاصل متدرج)</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label id="lbl-thickness">Thickness (Meters):</label>
                    <input type="number" id="in-thickness" class="form-control" value="8" min="0.5" step="0.5">
                </div>
                <div class="form-group">
                    <label id="lbl-hardness">Weathering Resistance (1-5):</label>
                    <input type="number" id="in-hardness" class="form-control" value="3" min="1" max="5">
                </div>
            </div>

            <div class="checkbox-card">
                <input type="checkbox" id="chk-has-desc" checked>
                <label for="chk-has-desc" id="lbl-chk-desc" style="margin:0; color:#fff; cursor:pointer;">Include Auto Technical Description</label>
            </div>

            <button class="btn btn-add" onclick="pushLayer()"><i class="fas fa-draw-polygon"></i> <span id="btn-txt-add">Plot Layer Log</span></button>
            <button class="btn btn-export" onclick="downloadLog()"><i class="fas fa-file-image"></i> <span id="btn-txt-export">Export PNG Chart</span></button>
            <button class="btn btn-clear" onclick="resetApp()"><i class="fas fa-undo"></i> <span id="btn-txt-clear">Reset Laboratory</span></button>
        </div>

        <div class="panel">
            <h3 class="panel-title"><i class="fas fa-chart-line"></i> <span id="lbl-panel-output">Stratigraphic Column Output</span></h3>
            <div class="canvas-area">
                <canvas id="mainCanvas" width="900" height="550"></canvas>
            </div>
        </div>
    </div>

    <script>
        // الدليل الشامل لجميع صخور العالم الجيولوجية ومكتبة شندل
        const rockWorldData = {
            Sedimentary: ["Sandstone", "Shale", "Limestone", "Conglomerate", "Breccia", "Siltstone", "Claystone", "Marl", "Dolostone", "Chalk"],
            Igneous: ["Basalt", "Granite", "Gabbro", "Obsidian", "Rhyolite", "Diorite", "Pumice", "Andesite"],
            Metamorphic: ["Schist", "Gneiss", "Marble", "Quartzite", "Slate", "Phyllite"],
            Evaporites: ["Gypsum", "Anhydrite", "Halite"]
        };

        let currentLanguage = "en";
        let fieldLayers = [];
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        const translationMap = {
            en: {
                title: "Shandal System for Geological Field Survey", subtitle: "Modern Stratigraphic Column Laboratory",
                panelInputs: "Geological Settings", formation: "Formation Name:", age: "Geological Age (Optional):",
                lithoType: "Lithology Type:", rockName: "Rock Name:", bgColor: "Rock Base Color:",
                patternColor: "Hatch/Pattern Color:", chkInterbed: "Has Interbedded Component", secRock: "Secondary Rock:",
                interbedStyle: "Relationship Style:", contact: "Bottom Bed Contact:", thickness: "Thickness (Meters):",
                hardness: "Weathering Resistance (1-5):", chkDesc: "Include Auto Technical Description",
                btnAdd: "Plot Layer Log", btnExport: "Export PNG Chart", btnClear: "Reset Laboratory", panelOutput: "Stratigraphic Column Output"
            },
            ar: {
                title: "نظام شندل للمسح الميداني الجيولوجي", subtitle: "العمود الطباقي الجيولوجي الحديث",
                panelInputs: "محددات الطبقات الجيولوجية الحقلية", formation: "اسم التكوين الجيولوجي:", age: "العمر الجيولوجي (اختياري):",
                lithoType: "تصنيف الليثولوجي الأساسي:", rockName: "اسم الصخرة المحددة:", bgColor: "اللون الجيولوجي للصخرة:",
                patternColor: "لون نقش التظليل (Hatch):", chkInterbed: "تحتوي الطبقة على تعاقب أو تداخل صخري ثانٍ", secRock: "الصخرة الثانوية المتداخلة:",
                interbedStyle: "نوع العلاقة الطباقية:", contact: "طبيعة الحد الفاصل السفلي للطبقة:", thickness: "سمك الطبقة الكامل (Thickness):",
                hardness: "مقاومة بروفايل التجوية والصلابة (1-5):", chkDesc: "إدراج وصف فني علمي تلقائي",
                btnAdd: "إسقاط ورسم الطبقة الحقلية", btnExport: "تصدير المخطط الجيولوجي كـ PNG", btnClear: "إعادة تهيئة مختبر شندل", panelOutput: "لوحة عرض العمود الطباقي الهندسي الرصين"
            }
        };

        function swapLanguage() {
            currentLanguage = currentLanguage === "en" ? "ar" : "en";
            const element = document.getElementById('shandalApp');
            element.setAttribute('dir', currentLanguage === "ar" ? "rtl" : "ltr");
            document.getElementById('lang-btn-text').innerText = currentLanguage === "ar" ? "English" : "العربية";
            
            document.getElementById('app-title').innerText = translationMap[currentLanguage].title;
            document.getElementById('app-subtitle').innerHTML = `<i class="fas fa-layer-group"></i> ${translationMap[currentLanguage].subtitle}`;
            document.getElementById('lbl-panel-inputs').innerText = translationMap[currentLanguage].panelInputs;
            document.getElementById('lbl-formation').innerText = translationMap[currentLanguage].formation;
            document.getElementById('lbl-age').innerText = translationMap[currentLanguage].age;
            document.getElementById('lbl-text-litho-type' || 'lbl-litho-type').innerText = translationMap[currentLanguage].lithoType;
            document.getElementById('lbl-rock-name').innerText = translationMap[currentLanguage].rockName;
            document.getElementById('lbl-bg-color').innerText = translationMap[currentLanguage].bgColor;
            document.getElementById('lbl-pattern-color').innerText = translationMap[currentLanguage].patternColor;
            document.getElementById('lbl-chk-interbed').innerText = translationMap[currentLanguage].chkInterbed;
            document.getElementById('lbl-sec-rock').innerText = translationMap[currentLanguage].secRock;
            document.getElementById('lbl-interbed-style').innerText = translationMap[currentLanguage].interbedStyle;
            document.getElementById('lbl-contact').innerText = translationMap[currentLanguage].contact;
            document.getElementById('lbl-thickness').innerText = translationMap[currentLanguage].thickness;
            document.getElementById('lbl-hardness').innerText = translationMap[currentLanguage].hardness;
            document.getElementById('lbl-chk-desc').innerText = translationMap[currentLanguage].chkDesc;
            document.getElementById('btn-txt-add').innerText = translationMap[currentLanguage].btnAdd;
            document.getElementById('btn-txt-export').innerText = translationMap[currentLanguage].btnExport;
            document.getElementById('btn-txt-clear').innerText = translationMap[currentLanguage].btnClear;
            document.getElementById('lbl-panel-output').innerText = translationMap[currentLanguage].panelOutput;
            
            renderStratigraphyCanvas();
        }

        function loadRockTypes() {
            const currentMainType = document.getElementById('sel-litho-type').value;
            const primaryDropdown = document.getElementById('sel-rock-name');
            const secondaryDropdown = document.getElementById('sel-sec-rock');
            
            primaryDropdown.innerHTML = "";
            secondaryDropdown.innerHTML = "";
            
            rockWorldData[currentMainType].forEach(rock => {
                primaryDropdown.innerHTML += `<option value="${rock}">${rock}</option>`;
                secondaryDropdown.innerHTML += `<option value="${rock}">${rock}</option>`;
            });
        }

        function toggleInterbedRow() {
            const active = document.getElementById('chk-has-interbed').checked;
            document.getElementById('row-interbed').style.display = active ? 'block' : 'none';
        }

        // محرك الأنسجة الجيولوجية المتقدم (Advanced Canvas Hatching Engine)
        function compileGeologicalPattern(type, patColor, baseBgColor) {
            const bufferCanvas = document.createElement('canvas');
            const bCtx = bufferCanvas.getContext('2d');
            bufferCanvas.width = 30; bufferCanvas.height = 30;

            bCtx.fillStyle = baseBgColor;
            bCtx.fillRect(0, 0, 30, 30);
            bCtx.strokeStyle = patColor; bCtx.fillStyle = patColor; bCtx.lineWidth = 1;

            if (type === "Sandstone") { // نقاط رملية متناسقة دقيقة
                bCtx.fillRect(5, 5, 1.5, 1.5); bCtx.fillRect(20, 10, 1.5, 1.5);
                bCtx.fillRect(12, 22, 1.5, 1.5); bCtx.fillRect(25, 25, 1.5, 1.5);
            } else if (type === "Limestone") { // نقش الطابوق القياسي للحجر الجيري
                bCtx.strokeRect(0, 0, 30, 15); bCtx.strokeRect(-15, 15, 30, 15); bCtx.strokeRect(15, 15, 30, 15);
            } else if (type === "Shale") { // خطوط أفقية طينية متوازية
                bCtx.beginPath(); bCtx.moveTo(0, 10); bCtx.lineTo(30, 10); bCtx.moveTo(0, 20); bCtx.lineTo(30, 20); bCtx.stroke();
            } else if (type === "Conglomerate") { // دوائر ورصيص حصوي
                bCtx.beginPath(); bCtx.arc(8, 10, 4, 0, Math.PI*2); bCtx.arc(22, 20, 5, 0, Math.PI*2); bCtx.stroke();
            } else if (type === "Breccia") { // شظايا ومثلثات حادة
                bCtx.beginPath(); bCtx.moveTo(5, 5); bCtx.lineTo(12, 18); bCtx.lineTo(2, 15); bCtx.closePath();
                bCtx.moveTo(20, 15); bCtx.lineTo(28, 22); bCtx.lineTo(18, 28); bCtx.closePath(); bCtx.stroke();
            } else if (type === "Gypsum" || type === "Anhydrite") { // خطوط مائلة متبخرات
                bCtx.beginPath(); bCtx.moveTo(0, 30); bCtx.lineTo(30, 0); bCtx.stroke();
            } else { // نقش افتراضي لباقي الصخور
                bCtx.beginPath(); bCtx.moveTo(0,0); bCtx.lineTo(30,30); bCtx.stroke();
            }
            return ctx.createPattern(bufferCanvas, 'repeat');
        }

        function pushLayer() {
            const dataLayer = {
                formation: document.getElementById('in-formation').value || "Fm.",
                age: document.getElementById('in-age').value || "",
                rockType: document.getElementById('sel-rock-name').value,
                isInterbed: document.getElementById('chk-has-interbed').checked,
                secRock: document.getElementById('sel-sec-rock').value,
                interbedStyle: document.getElementById('sel-interbed-style').value,
                contact: document.getElementById('sel-contact').value,
                thickness: parseFloat(document.getElementById('in-thickness').value) || 5,
                hardness: parseInt(document.getElementById('in-hardness').value) || 3,
                bgColor: document.getElementById('in-bg-color').value,
                patColor: document.getElementById('in-pattern-color').value,
                needDesc: document.getElementById('chk-has-desc').checked
            };
            fieldLayers.unshift(dataLayer); // الترتيب من الأحدث في الأعلى للأقدم في الأسفل
            renderStratigraphyCanvas();
        }

        function renderStratigraphyCanvas() {
            // تصفية اللوحة بالكامل
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ترويسة اللوحة الرسمية والأكاديمية للنظام
            ctx.fillStyle = "#0a0f1d"; ctx.font = "bold 16px Arial, Helvetica";
            const mainHeaderStr = currentLanguage === "ar" ? "نظام شندل للمسح الميداني الجيولوجي - مخطط السجل الطباقي الحديث" : "SHANDAL SYSTEM FOR GEOLOGICAL FIELD SURVEY - MODERN STRATIGRAPHIC COLUMN";
            ctx.fillText(mainHeaderStr, 40, 45);

            // رسم الإطار الخارجي والمسارات الفنية للجداول ( tracks )
            ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5;
            ctx.strokeRect(30, 80, canvas.width - 60, canvas.height - 120);

            let trackFmX = 140;      // تراك التكوين والعمر
            let trackColX = 360;     // تراك المخطط العمودي نفسه
            let trackThickX = 460;   // تراك السمك (Thickness)

            ctx.beginPath();
            ctx.moveTo(trackFmX, 80); ctx.lineTo(trackFmX, canvas.height - 40);
            ctx.moveTo(trackColX, 80); ctx.lineTo(trackColX, canvas.height - 40);
            ctx.moveTo(trackThickX, 80); ctx.lineTo(trackThickX, canvas.height - 40);
            ctx.stroke();

            // طباعة العناوين الصارمة للأعمدة باللغة المختارة
            ctx.font = "bold 12px Arial";
            ctx.fillText(currentLanguage === "ar" ? "التكوين والعمر" : "Formation / Age", 40, 105);
            ctx.fillText(currentLanguage === "ar" ? "العمود الليثولوجي والصلابة" : "Lithology & Hardness Profile", trackFmX + 15, 105);
            ctx.fillText(currentLanguage === "ar" ? "Thickness" : "Thickness", trackColX + 12, 105);
            ctx.fillText(currentLanguage === "ar" ? "الوصف الجيولوجي والدليل" : "Technical Description & Legend", trackThickX + 15, 105);

            ctx.beginPath(); ctx.moveTo(30, 120); ctx.lineTo(canvas.width - 30, 120); ctx.stroke();

            if (fieldLayers.length === 0) return;

            let currentY = 120;
            let drawHeightTotal = canvas.height - 160;
            let sumThickness = fieldLayers.reduce((s, x) => s + x.thickness, 0);
            let pixelRatioFactor = drawHeightTotal / sumThickness;

            fieldLayers.forEach(layer => {
                let currentBedH = layer.thickness * pixelRatioFactor;
                let calculatedW = 120 + (layer.hardness * 16); // العرض متغير علمياً لمحاكاة التجوية الطبيعية للمنحدر الجيولوجي

                // رسم النسيج الجيولوجي الأساسي للطبقة الصخرية المحددة
                let primaryHatch = compileGeologicalPattern(layer.rockType, layer.patColor, layer.bgColor);
                ctx.fillStyle = primaryHatch;
                ctx.fillRect(trackFmX + 5, currentY, calculatedW, currentBedH);
                ctx.strokeRect(trackFmX + 5, currentY, calculatedW, currentBedH);

                // معالجة ورسم التعاقب (Interbedded) أو التداخل البصري المشترك
                if (layer.isInterbed) {
                    let secondaryHatch = compileGeologicalPattern(layer.secRock, layer.patColor, "#ffffff");
                    ctx.save();
                    ctx.beginPath(); ctx.rect(trackFmX + 5, currentY, calculatedW, currentBedH); ctx.clip();
                    
                    if (layer.interbedStyle === "interbedded") {
                        // محاكاة الخط المائل الحقيقي الفاصل في منتصف الطبقة للتعبير الجيولوجي القياسي عن التعاقب الخطي
                        ctx.beginPath();
                        ctx.moveTo(trackFmX + 5, currentY); ctx.lineTo(trackFmX + 5 + calculatedW, currentY + currentBedH);
                        ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; ctx.stroke();
                    } else {
                        // تداخل مشترك ممتزج
                        ctx.fillStyle = "rgba(0,0,0,0.06)"; ctx.fillRect(trackFmX + 5, currentY + (currentBedH / 2), calculatedW, currentBedH / 2);
                    }
                    ctx.restore();
                }

                // رسم معالجة وطبيعة الحدود الفاصلة السفلية (Bottom Bed Contacts)
                ctx.save(); ctx.lineWidth = 2; ctx.beginPath();
                if (layer.contact === "sharp") {
                    ctx.setLineDash([]); ctx.moveTo(trackFmX + 5, currentY + currentBedH); ctx.lineTo(trackFmX + 5 + calculatedW, currentY + currentBedH);
                } else if (layer.contact === "gradational") {
                    ctx.setLineDash([6, 5]); ctx.moveTo(trackFmX + 5, currentY + currentBedH); ctx.lineTo(trackFmX + 5 + calculatedW, currentY + currentBedH);
                } else if (layer.contact === "erosional") {
                    ctx.setLineDash([]);
                    let startX = trackFmX + 5; ctx.moveTo(startX, currentY + currentBedH);
                    while(startX < (trackFmX + 5 + calculatedW)) {
                        startX += 8;
                        ctx.lineTo(startX, currentY + currentBedH + (Math.sin(startX) * 4));
                    }
                }
                ctx.strokeStyle = "#000000"; ctx.stroke(); ctx.restore();

                // طباعة نصوص التكوين والعمر الجيولوجي بشكل منفصل ومحاذي تماماً
                ctx.fillStyle = "#000000"; ctx.font = "bold 11px Arial";
                ctx.fillText(layer.formation, 38, currentY + 25);
                if (layer.age !== "") {
                    ctx.font = "italic 10px Arial"; ctx.fillStyle = "#4b5563";
                    ctx.fillText(`(${layer.age})`, 38, currentY + 40);
                }

                // طباعة كلمة السمك والوصف الرسمي الفني والـ Legend للطبقة
                ctx.fillStyle = "#000000"; ctx.font = "12px Arial";
                ctx.fillText(`${layer.thickness} m`, trackColX + 12, currentY + (currentBedH / 2) + 4);

                let logTechnicalText = layer.rockType;
                if(layer.isInterbed) {
                    logTechnicalText += layer.interbedStyle === "interbedded" ? ` Interbedded with ${layer.secRock}` : ` Mixed with ${layer.secRock}`;
                }
                
                ctx.font = "bold 11px Arial"; ctx.fillText(logTechnicalText, trackThickX + 15, currentY + 22);
                
                // الوصف الفني التلقائي إذا كان مفعلاً
                if (layer.needDesc) {
                    ctx.font = "10px Arial"; ctx.fillStyle = "#374151";
                    let autoDesc = currentLanguage === "ar" ? `طبقة صخرية رصينة ذات مقاومة تجوية تعادل ${layer.hardness}/5.` : `Standard lithology beds showing weathering resistance index of ${layer.hardness}/5.`;
                    ctx.fillText(autoDesc, trackThickX + 15, currentY + 38);
                }

                // رسم صندوق الدليل المصغر التابع (Mini Legend Cell) بجانب الوصف لكل طبقة منفصلة
                ctx.save();
                ctx.fillStyle = primaryHatch; ctx.fillRect(canvas.width - 95, currentY + 10, 50, 20);
                ctx.strokeRect(canvas.width - 95, currentY + 10, 50, 20);
                ctx.restore();

                currentY += currentBedH;
            });
        }

        function downloadLog() {
            if (fieldLayers.length === 0) return;
            const captureLink = document.createElement('a');
            captureLink.download = 'Shandal_Premium_Stratigraphy.png';
            captureLink.href = canvas.toDataURL(); captureLink.click();
        }

        function resetApp() {
            fieldLayers = []; renderStratigraphyCanvas();
        }

        // إقلاع النظام التلقائي الأول للمختبر
        loadRockTypes();
        renderStratigraphyCanvas();
    </script>
</body>
</html>
