<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر شندل - تقييم الصخور المصدرية</title>
    
    <!-- مكتبة Plotly.js للرسم العلمي الدقيق -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f111a; --card-bg: #1a1d2d;
            --accent-primary: #8b5cf6; --accent-secondary: #ec4899;
            --text-light: #f8fafc; --border-color: rgba(255,255,255,0.1);
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--accent-primary); padding-bottom: 15px; }
        header h1 { margin: 0; color: var(--accent-secondary); font-size: 28px; }
        header p { margin: 5px 0 0; color: #cbd5e1; font-size: 14px; }
        
        .lab-container { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        @media (max-width: 900px) { .lab-container { grid-template-columns: 1fr; } }
        
        .input-panel { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); height: fit-content; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; color: #94a3b8;}
        .form-control { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 6px; outline: none; }
        .form-control:focus { border-color: var(--accent-primary); }
        
        .btn-add { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        
        .plot-panel { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
        .data-table th, .data-table td { padding: 12px; text-align: center; border: 1px solid var(--border-color); font-size: 14px; }
        .data-table th { background: rgba(139, 92, 246, 0.2); color: var(--accent-primary); }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-flask"></i> مختبر شندل الجيوكيميائي</h1>
        <p>التقييم الآلي للجهد البترولي (TOC vs HI) وفقاً لبيانات التحلل الحراري (Rock-Eval)</p>
    </header>

    <div class="lab-container">
        
        <!-- لوحة إدخال البيانات -->
        <div class="input-panel">
            <h3><i class="fas fa-edit"></i> إدخال بيانات العينة</h3>
            
            <div class="form-group">
                <label>اسم العينة أو رقم البئر:</label>
                <input type="text" id="sampleName" class="form-control" placeholder="مثال: Aj.8 أو Ba.1">
            </div>
            
            <div class="form-group">
                <label>نسبة الكربون العضوي الكلي (TOC %):</label>
                <input type="number" id="toc" class="form-control" step="0.01" placeholder="مثال: 10.22">
            </div>
            
            <div class="form-group">
                <label>ناتج التحلل الحراري S2 (mg HC/g):</label>
                <input type="number" id="s2" class="form-control" step="0.01" placeholder="مثال: 29.2">
                <small style="color:#64748b; font-size:11px;">سيقوم النظام بحساب مؤشر (HI) تلقائياً.</small>
            </div>
            
            <button class="btn-add" onclick="processSample()"><i class="fas fa-chart-line"></i> حساب وتسقيط النقطة برمجياً</button>
        </div>

        <!-- المخطط الرياضي -->
        <div class="plot-panel">
            <div id="sourceRockPlot" style="width:100%; height:550px;"></div>
        </div>

    </div>

    <!-- جدول النتائج المتقدمة -->
    <table class="data-table" id="resultsTable">
        <thead>
            <tr>
                <th>العينة</th>
                <th>TOC (wt%)</th>
                <th>S2 (mg/g)</th>
                <th>مؤشر الهيدروجين (HI)</th>
                <th>جودة المصدر (Quantity)</th>
                <th>نوع الإنتاج المتوقع (Quality)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- ستظهر البيانات هنا -->
        </tbody>
    </table>

    <script>
        // مصفوفة لتخزين العينات برمجياً
        let rockSamples = {
            x: [], // TOC values
            y: [], // HI values
            text: [], // Labels
            mode: 'markers+text',
            type: 'scatter',
            textposition: 'top center',
            marker: { size: 12, color: '#ec4899', line: {color: 'black', width: 2} },
            name: 'العينات المدروسة'
        };

        // الدالة الرياضية الأساسية لبناء المخطط الأكاديمي
        function initPlot() {
            let layout = {
                title: { text: '<b>Hydrogen Index (HI) vs. Total Organic Carbon (TOC)</b>', font: {family: 'Arial', size: 18} },
                xaxis: { 
                    type: 'log', 
                    range: [Math.log10(0.1), Math.log10(100)], 
                    title: { text: '<b>Total organic carbon content (wt%)</b>', font: {size: 14} },
                    tickvals: [0.1, 1, 10, 100],
                    showgrid: false,
                    zeroline: false
                },
                yaxis: { 
                    range: [0, 1000], 
                    title: { text: '<b>Hydrogen Index (HI; mg HC/g TOC)</b>', font: {size: 14} },
                    showgrid: false,
                    zeroline: false
                },
                // رسم الخطوط المرجعية الدقيقة هندسياً
                shapes: [
                    // الحدود العمودية للـ TOC
                    { type: 'line', x0: 0.5, x1: 0.5, y0: 0, y1: 1000, line: {color: 'black', width: 2} },
                    { type: 'line', x0: 1.0, x1: 1.0, y0: 0, y1: 1000, line: {color: 'black', width: 2} },
                    { type: 'line', x0: 2.0, x1: 2.0, y0: 0, y1: 1000, line: {color: 'black', width: 2} },
                    // الحدود الأفقية للـ HI
                    { type: 'line', x0: 0.1, x1: 100, y0: 200, y1: 200, line: {color: 'black', width: 2} },
                    { type: 'line', x0: 0.1, x1: 100, y0: 340, y1: 340, line: {color: 'black', width: 2} }
                ],
                // التسميات الجيوكيميائية للمناطق
                annotations: [
                    { x: Math.log10(0.2), y: 950, text: '<b>Poor</b>', showarrow: false, font: {size: 16} },
                    { x: Math.log10(0.7), y: 950, text: '<b>Fair</b>', showarrow: false, font: {size: 16} },
                    { x: Math.log10(1.4), y: 950, text: '<b>Good</b>', showarrow: false, font: {size: 16} },
                    { x: Math.log10(10), y: 950, text: '<b>Very Good / Excellent</b>', showarrow: false, font: {size: 16} },
                    { x: Math.log10(30), y: 450, text: '<b>Oil-prone</b>', showarrow: false, font: {size: 16} },
                    { x: Math.log10(30), y: 270, text: '<b>Mixed (oil & gas)</b>', showarrow: false, font: {size: 16} },
                    { x: Math.log10(30), y: 100, text: '<b>Gas-prone</b>', showarrow: false, font: {size: 16} }
                ],
                plot_bgcolor: '#f8fafc',
                paper_bgcolor: 'white',
                margin: { l: 60, r: 20, t: 50, b: 50 }
            };

            Plotly.newPlot('sourceRockPlot', [rockSamples], layout, {responsive: true});
        }

        // دالة استقبال ومعالجة البيانات
        function processSample() {
            let name = document.getElementById('sampleName').value || 'Unknown';
            let toc = parseFloat(document.getElementById('toc').value);
            let s2 = parseFloat(document.getElementById('s2').value);

            if (isNaN(toc) || isNaN(s2) || toc <= 0) {
                alert("يرجى إدخال قيم رياضية صحيحة لـ TOC و S2.");
                return;
            }

            // المعادلة الأكاديمية لحساب HI
            let hi = (s2 / toc) * 100;
            hi = Math.round(hi * 100) / 100; // تقريب لمرتبتين عشريتين

            // التقييم الجيوكيميائي
            let tocQuality = toc < 0.5 ? "Poor" : (toc < 1.0 ? "Fair" : (toc < 2.0 ? "Good" : "Very Good"));
            let hiQuality = hi < 200 ? "Gas-prone" : (hi < 340 ? "Mixed (oil & gas)" : "Oil-prone");

            // تسقيط النقطة على المخطط
            rockSamples.x.push(toc);
            rockSamples.y.push(hi);
            rockSamples.text.push(name);
            Plotly.redraw('sourceRockPlot');

            // تحديث الجدول
            let tbody = document.getElementById('tableBody');
            let row = `<tr>
                <td><strong>${name}</strong></td>
                <td>${toc}</td>
                <td>${s2}</td>
                <td style="color:var(--accent-primary); font-weight:bold;">${hi}</td>
                <td>${tocQuality}</td>
                <td>${hiQuality}</td>
            </tr>`;
            tbody.innerHTML += row;

            // تفريغ الحقول لإدخال عينة جديدة
            document.getElementById('sampleName').value = '';
            document.getElementById('toc').value = '';
            document.getElementById('s2').value = '';
        }

        // تشغيل المخطط عند تحميل الصفحة
        initPlot();
    </script>
</body>
</html>
