<!DOCTYPE html>
<html lang="ar" dir="rtl" id="shandalApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام شندل - المختبر الجيوفيزيائي الفضائي</title>
    
    <!-- مكتبة الخرائط Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0f1d; --card-bg: #141d36;
            --accent-gold: #f59e0b; --accent-blue: #0ea5e9;
            --text-light: #f8fafc; --border-color: rgba(255,255,255,0.08);
            --success: #10b981; --warning: #f59e0b;
        }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 0; transition: all 0.3s ease; }
        
        /* Header Styling */
        header { background: linear-gradient(135deg, #141d36, #0a0f1d); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent-gold); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .brand h1 { margin: 0; font-size: 24px; color: var(--text-light); }
        .brand p { margin: 6px 0 0; color: var(--accent-blue); font-weight: 600; font-size: 15px; }
        .lang-toggle { background: rgba(14, 165, 233, 0.15); border: 2px solid var(--accent-blue); color: var(--text-light); padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .lang-toggle:hover { background: var(--accent-blue); color: var(--bg-dark); }

        /* Main Layout */
        .main-container { display: grid; grid-template-columns: 350px 1fr; gap: 20px; padding: 20px; height: calc(100vh - 120px); box-sizing: border-box;}
        @media (max-width: 992px) { .main-container { grid-template-columns: 1fr; height: auto; } }

        /* Control Panel */
        .control-panel { background: var(--card-bg); border-radius: 12px; padding: 25px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .panel-title { font-size: 18px; color: var(--accent-gold); margin: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; color: #94a3b8; font-weight: bold; }
        .form-control { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 6px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--accent-blue); }

        .btn { padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; color: white;}
        .btn-box { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); }
        .btn-box:hover { background: rgba(255,255,255,0.2); }
        .btn-fetch { background: linear-gradient(135deg, #8b5cf6, #6d28d9); margin-top: 10px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
        .btn-fetch:hover { transform: translateY(-2px); }
        .btn-download { background: var(--success); display: none; animation: fadeIn 0.5s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);}
        
        /* Loading Status Area */
        .status-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px; font-size: 14px; color: #cbd5e1; min-height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; border: 1px dashed var(--border-color); line-height: 1.6;}
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent-blue); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Map Area */
        .map-wrapper { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--border-color); background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.3);}
        #map { width: 100%; height: 100%; z-index: 1; }
        
        /* Selection Viewfinder (The Box) */
        #viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; border: 3px dashed #ef4444; background: rgba(239, 68, 68, 0.1); z-index: 1000; pointer-events: none; display: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); }
        .viewfinder-label { position: absolute; top: -30px; left: 0; right: 0; text-align: center; color: white; background: #ef4444; padding: 4px; font-weight: bold; font-size: 12px; border-radius: 4px; }

        /* Custom Map Controls Overlay */
        .map-overlay-tools { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .map-tool-btn { width: 45px; height: 45px; background: rgba(20, 29, 54, 0.9); border: 2px solid var(--accent-blue); color: white; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s;}
        .map-tool-btn:hover { background: var(--accent-blue); color: var(--bg-dark); transform: scale(1.05); }
        
        .north-arrow { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(255,255,255,0.9); width: 40px; height: 60px; border-radius: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; color: #1e293b; border: 2px solid #cbd5e1; box-shadow: 0 4px 10px rgba(0,0,0,0.3); pointer-events: none;}
        .north-arrow i { font-size: 24px; color: #ef4444; }

        footer { text-align: center; padding: 15px; color: #64748b; font-size: 13px; border-top: 1px solid var(--border-color); margin-top: 20px; }

        /* RTL/LTR Handling */
        [dir="rtl"] .lang-toggle i { transform: rotate(180deg); }
        [dir="rtl"] .map-overlay-tools { right: 20px; left: auto; }
        [dir="rtl"] .north-arrow { left: 20px; right: auto; }
        
        [dir="ltr"] .map-overlay-tools { left: 20px; right: auto; }
        [dir="ltr"] .north-arrow { right: 20px; left: auto; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1 id="appTitle">نظام شندل للمسح الميداني الجيولوجي</h1>
            <p id="appSubtitle"><i class="fas fa-satellite"></i> المختبر الجيوفيزيائي الفضائي والخرائط الإقليمية</p>
        </div>
        <button class="lang-toggle" onclick="toggleLanguage()">
            <span id="langText">English</span> <i class="fas fa-arrow-right"></i>
        </button>
    </header>

    <div class="main-container">
        
        <!-- لوحة التحكم -->
        <div class="control-panel">
            <h3 class="panel-title" id="panelTitle"><i class="fas fa-cogs"></i> إعدادات استخراج البيانات</h3>
            
            <button class="btn btn-box" id="btnToggleBox" onclick="toggleSelectionBox()">
                <i class="fas fa-vector-square"></i> <span id="lblBtnBox">إظهار مستطيل التحديد</span>
            </button>

            <div class="form-group">
                <label id="lblDataType">نوع المسح الجيوفيزيائي المطلوب:</label>
                <select class="form-control" id="dataType">
                    <option value="topo" id="optTopo" selected>البيانات الطبوغرافية الحقيقية (SRTM DEM)</option>
                    <option value="magnetic" id="optMag">بيانات الشذوذ المغناطيسي (Magnetic Anomaly)</option>
                    <option value="gravity" id="optGrav">بيانات الشذوذ الجذبي (Bouguer Gravity)</option>
                </select>
            </div>

            <div class="form-group">
                <label id="lblResolution">دقة الشبكة (Grid Resolution):</label>
                <select class="form-control" id="resolution">
                    <option value="high" id="optResHigh">عالية جداً (High - كثافة نقاط علمية)</option>
                    <option value="medium" id="optResMed" selected>متوسطة (Medium - كثافة قياسية)</option>
                    <option value="low" id="optResLow">منخفضة للخرائط الإقليمية (Low)</option>
                </select>
            </div>

            <button class="btn btn-fetch" id="btnFetch" onclick="startDataExtraction()">
                <i class="fas fa-cloud-download-alt"></i> <span id="lblBtnFetch">الاتصال وجلب الإحداثيات (X,Y,Z)</span>
            </button>

            <div class="status-box">
                <div class="loader" id="loader"></div>
                <span id="statusText">النظام في وضع الاستعداد. قم بتحديد المنطقة على الخريطة أولاً.</span>
            </div>

            <button class="btn btn-download" id="btnDownload" onclick="downloadCSV()">
                <i class="fas fa-file-csv"></i> <span id="lblBtnDownload">تصدير الملف (CSV Format)</span>
            </button>
        </div>

        <!-- الخريطة -->
        <div class="map-wrapper">
            <div id="map"></div>
            
            <!-- اتجاه الشمال -->
            <div class="north-arrow" id="northArrow">
                N<br><i class="fas fa-long-arrow-alt-up"></i>
            </div>

            <!-- أدوات التحكم الجانبية -->
            <div class="map-overlay-tools">
                <button class="map-tool-btn" onclick="goToMyLocation()" title="الذهاب لموقعي الحالي">
                    <i class="fas fa-crosshairs"></i>
                </button>
            </div>

            <!-- مستطيل التحديد (Viewfinder) -->
            <div id="viewfinder">
                <div class="viewfinder-label" id="lblViewfinder">نطاق السحب والإسقاط (Area of Interest)</div>
            </div>
        </div>

    </div>

    <footer>
        <span id="footerText">جميع الحقوق محفوظة لدى الجيولوجي علي شندل الجنابي © 2026 - قسم الاستكشاف الجيوفيزيائي</span>
    </footer>

    <script>
        // ==========================================
        // 1. نظام اللغات (Localization System)
        // ==========================================
        let currentLang = "ar";
        const translations = {
            en: {
                appTitle: "Shandal System for Geological Field Survey",
                appSubtitle: "<i class='fas fa-satellite'></i> Geophysical Spatial Lab & Regional Mapping",
                langText: "العربية",
                panelTitle: "<i class='fas fa-cogs'></i> Data Extraction Settings",
                lblBtnBox: "Show Selection Bounding Box",
                lblBtnBoxHide: "Hide Selection Bounding Box",
                lblDataType: "Geophysical Survey Type:",
                optMag: "Magnetic Anomaly Data (EMAG2)",
                optGrav: "Bouguer Gravity Anomaly (ICGEM)",
                optTopo: "Real Topographic Data (SRTM DEM)",
                lblResolution: "Grid Resolution:",
                optResHigh: "Very High (High point density)",
                optResMed: "Medium (Standard density)",
                optResLow: "Low (Regional Mapping)",
                lblBtnFetch: "Connect & Fetch Coordinates (X,Y,Z)",
                statusIdle: "System is idle. Select area on map first.",
                statusSuccess: "Coordinates Fetched Successfully! Grid is ready.",
                statusErrorBox: "Please show the selection box first.",
                statusErrorArea: "Geological Alert: The selected area is too small (< 2 sq km) for spatial DEM surveys. This will cause pixelation errors. Please zoom out to cover a larger regional area.",
                lblBtnDownload: "Export Data File (CSV Format)",
                lblViewfinder: "Area of Interest (Drag map to adjust)",
                footerText: "All Rights Reserved to Geologist Ali Shandal Al-Janabi © 2026 - Geophysical Exploration Dept."
            },
            ar: {
                appTitle: "نظام شندل للمسح الميداني الجيولوجي",
                appSubtitle: "<i class='fas fa-satellite'></i> المختبر الجيوفيزيائي الفضائي والخرائط الإقليمية",
                langText: "English",
                panelTitle: "<i class='fas fa-cogs'></i> إعدادات استخراج البيانات",
                lblBtnBox: "إظهار مستطيل التحديد (زون الدراسة)",
                lblBtnBoxHide: "إخفاء مستطيل التحديد",
                lblDataType: "نوع المسح الجيوفيزيائي المطلوب:",
                optMag: "بيانات الشذوذ المغناطيسي (Magnetic Anomaly)",
                optGrav: "بيانات الشذوذ الجذبي (Bouguer Gravity)",
                optTopo: "البيانات الطبوغرافية الحقيقية (SRTM DEM)",
                lblResolution: "دقة الشبكة (Grid Resolution):",
                optResHigh: "عالية جداً (High - كثافة نقاط علمية)",
                optResMed: "متوسطة (Medium - كثافة قياسية)",
                optResLow: "منخفضة للخرائط الإقليمية (Low)",
                lblBtnFetch: "الاتصال وجلب الإحداثيات (X,Y,Z)",
                statusIdle: "النظام في وضع الاستعداد. قم بتحديد المنطقة على الخريطة أولاً.",
                statusSuccess: "تم سحب الإحداثيات والبيانات الحقيقية بنجاح! الملف جاهز.",
                statusErrorBox: "يرجى إظهار مستطيل التحديد على الخريطة أولاً.",
                statusErrorArea: "تنبيه جيولوجي فني: مساحة الدراسة صغيرة جداً (أقل من 2 كم²). لا يجوز علمياً استخدام الرفع الفضائي SRTM لهذه المساحة لكي لا يظهر تشوه (Pixelation) في الكنتور. يرجى تصغير الخريطة وتحديد نطاق أوسع.",
                lblBtnDownload: "تصدير الملف (CSV Format)",
                lblViewfinder: "نطاق السحب والإسقاط (اسحب الخريطة لضبط الموقع)",
                footerText: "جميع الحقوق محفوظة لدى الجيولوجي علي شندل الجنابي © 2026 - قسم الاستكشاف الجيوفيزيائي"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === "ar" ? "en" : "ar";
            document.getElementById('shandalApp').setAttribute('dir', currentLang === "ar" ? "rtl" : "ltr");
            
            const t = translations[currentLang];
            document.getElementById('appTitle').innerText = t.appTitle;
            document.getElementById('appSubtitle').innerHTML = t.appSubtitle;
            document.getElementById('langText').innerText = t.langText;
            document.getElementById('panelTitle').innerHTML = t.panelTitle;
            
            const boxDisplay = document.getElementById('viewfinder').style.display;
            document.getElementById('lblBtnBox').innerText = (boxDisplay === 'block') ? t.lblBtnBoxHide : t.lblBtnBox;
            
            document.getElementById('lblDataType').innerText = t.lblDataType;
            document.getElementById('optMag').innerText = t.optMag;
            document.getElementById('optGrav').innerText = t.optGrav;
            document.getElementById('optTopo').innerText = t.optTopo;
            
            document.getElementById('lblResolution').innerText = t.lblResolution;
            document.getElementById('optResHigh').innerText = t.optResHigh;
            document.getElementById('optResMed').innerText = t.optResMed;
            document.getElementById('optResLow').innerText = t.optResLow;
            
            document.getElementById('lblBtnFetch').innerText = t.lblBtnFetch;
            document.getElementById('lblBtnDownload').innerText = t.lblBtnDownload;
            document.getElementById('lblViewfinder').innerText = t.lblViewfinder;
            document.getElementById('footerText').innerText = t.footerText;
            
            document.getElementById('statusText').innerText = t.statusIdle;
            document.getElementById('btnDownload').style.display = 'none';
        }

        // ==========================================
        // 2. إعداد خريطة Leaflet
        // ==========================================
        let map;
        document.addEventListener("DOMContentLoaded", () => {
            map = L.map('map', {
                zoomControl: false
            }).setView([33.3152, 44.3661], 6);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri & Shandal System',
                maxZoom: 18
            }).addTo(map);

            L.tileLayer('https://stamen-tiles-{s}.a.ssl.fastly.net/toner-lines/{z}/{x}/{y}{r}.png', {
                attribution: '',
                opacity: 0.5,
                maxZoom: 18
            }).addTo(map);

            L.control.scale({ position: 'bottomright', metric: true, imperial: false }).addTo(map);
        });

        function goToMyLocation() {
            if (navigator.geolocation) {
                map.locate({setView: true, maxZoom: 14});
                map.on('locationfound', function(e) {
                    L.circleMarker(e.latlng, { radius: 8, fillColor: "#0ea5e9", color: "#fff", weight: 2, fillOpacity: 1 }).addTo(map)
                     .bindPopup(currentLang === 'ar' ? "موقعك الحالي" : "Your Location").openPopup();
                });
                map.on('locationerror', function(e) {
                    alert(currentLang === 'ar' ? "تعذر تحديد موقعك. تأكد من تفعيل GPS." : "Location access denied.");
                });
            }
        }

        function toggleSelectionBox() {
            const box = document.getElementById('viewfinder');
            const btnText = document.getElementById('lblBtnBox');
            const t = translations[currentLang];
            
            if (box.style.display === 'none' || box.style.display === '') {
                box.style.display = 'block';
                btnText.innerText = t.lblBtnBoxHide;
            } else {
                box.style.display = 'none';
                btnText.innerText = t.lblBtnBox;
                document.getElementById('btnDownload').style.display = 'none';
                document.getElementById('statusText').innerText = t.statusIdle;
            }
        }

        // حساب المسافة الحقيقية لضبط الأخطاء المورفولوجية
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; // نصف قطر الأرض بالكيلومتر
            var dLat = (lat2 - lat1) * Math.PI / 180;  
            var dLon = (lon2 - lon1) * Math.PI / 180; 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        // ==========================================
        // 4. محرك استخراج البيانات "المضاد للفشل" (Bulletproof Real API)
        // ==========================================
        let finalCSVData = ""; 

        async function startDataExtraction() {
            const t = translations[currentLang];
            const box = document.getElementById('viewfinder');
            const statusText = document.getElementById('statusText');
            const loader = document.getElementById('loader');
            const btnDownload = document.getElementById('btnDownload');
            const dataType = document.getElementById('dataType').value;

            if (box.style.display === 'none' || box.style.display === '') {
                statusText.innerText = t.statusErrorBox;
                statusText.style.color = "#ef4444";
                return;
            }

            const rect = box.getBoundingClientRect();
            const nwPoint = L.point(rect.left - map.getContainer().getBoundingClientRect().left, rect.top - map.getContainer().getBoundingClientRect().top);
            const sePoint = L.point(rect.right - map.getContainer().getBoundingClientRect().left, rect.bottom - map.getContainer().getBoundingClientRect().top);
            
            const nwLatLng = map.containerPointToLatLng(nwPoint);
            const seLatLng = map.containerPointToLatLng(sePoint);

            const bounds = {
                south: seLatLng.lat,
                north: nwLatLng.lat,
                west: nwLatLng.lng,
                east: seLatLng.lng
            };

            // حاجز الحماية الجيولوجي (Area Validation)
            if (dataType === 'topo') {
                const widthKm = getDistanceFromLatLonInKm(bounds.north, bounds.west, bounds.north, bounds.east);
                const heightKm = getDistanceFromLatLonInKm(bounds.north, bounds.west, bounds.south, bounds.west);
                const areaSqKm = widthKm * heightKm;

                // إذا كانت المساحة أصغر من 2 كيلومتر مربع نوقف العملية
                if (areaSqKm < 2.0) {
                    statusText.innerText = t.statusErrorArea;
                    statusText.style.color = "#ef4444";
                    return;
                }
            }

            statusText.style.color = "#cbd5e1";
            loader.style.display = 'block';
            btnDownload.style.display = 'none';

            if (dataType === 'topo') {
                try {
                    // استدعاء الدالة القوية الجديدة
                    finalCSVData = await fetchRealElevationData(bounds, statusText);
                    
                    loader.style.display = 'none';
                    statusText.style.color = "var(--success)";
                    statusText.innerHTML = `<strong>${t.statusSuccess}</strong><br><span style="font-size:12px; color:#94a3b8;">Bounds: [${bounds.south.toFixed(4)} N, ${bounds.west.toFixed(4)} E] to [${bounds.north.toFixed(4)} N, ${bounds.east.toFixed(4)} E]</span>`;
                    
                    btnDownload.style.display = 'flex';
                } catch (error) {
                    loader.style.display = 'none';
                    statusText.style.color = "#ef4444";
                    // رسالة الفشل النهائي تظهر فقط إذا استنفذ النظام جميع المحاولات
                    statusText.innerHTML = (currentLang === 'ar') ? "<strong>❌ فشل نهائي في الاتصال</strong><br><span style="font-size:12px;">قامت السيرفرات العالمية برفض الطلب رغم كل محاولات النظام. يرجى الانتظار بضع دقائق والمحاولة لاحقاً.</span>" : "<strong>❌ Final Connection Error</strong><br><span style="font-size:12px;">Global servers blocked the request after all retries. Please wait a few minutes and try again.</span>";
                    console.error("Critical API Error:", error);
                }
            } else {
                statusText.innerText = (currentLang === 'ar') ? "جاري تجهيز البيانات..." : "Processing Data...";
                setTimeout(() => {
                    loader.style.display = 'none';
                    statusText.style.color = "var(--warning)";
                    statusText.innerHTML = `<strong>تم تجهيز الملف</strong> (ملاحظة: البيانات الجذبية والمغناطيسية حالياً في طور ربط الـ API - تم توليد قيم اختبارية)<br><span style="font-size:12px; color:#94a3b8;">Bounds: [${bounds.south.toFixed(4)} N, ${bounds.west.toFixed(4)} E] to [${bounds.north.toFixed(4)} N, ${bounds.east.toFixed(4)} E]</span>`;
                    finalCSVData = generateMockGeophysicalData(bounds, dataType);
                    btnDownload.style.display = 'flex';
                }, 2000);
            }
        }

        // --- خوارزمية "الدبابة" لإرسال البيانات بذكاء (The Tank Algorithm) ---
        async function fetchRealElevationData(bounds, statusTextElement) {
            const resolutionConfig = document.getElementById('resolution').value;
            // دقة عالية = 40x40 نقطة (1600 نقطة إجمالاً)
            let steps = resolutionConfig === 'high' ? 40 : (resolutionConfig === 'medium' ? 25 : 15);
            
            let latStep = (bounds.north - bounds.south) / steps;
            let lngStep = (bounds.east - bounds.west) / steps;

            let points = [];
            for (let lat = bounds.south; lat <= bounds.north; lat += latStep) {
                for (let lng = bounds.west; lng <= bounds.east; lng += lngStep) {
                    points.push({ lat: lat.toFixed(5), lng: lng.toFixed(5) });
                }
            }

            // 1. التجزئة الدقيقة جداً (Micro-Chunking) - 20 نقطة فقط لضمان 100% قبول للرابط
            const chunkSize = 20; 
            let chunks = [];
            for (let i = 0; i < points.length; i += chunkSize) {
                chunks.push(points.slice(i, i + chunkSize));
            }

            let csv = "Longitude(X),Latitude(Y),Elevation(Z)\n";
            let results = [];

            // إرسال الطلبات للسيرفر بالتتابع الهادئ
            for (let i = 0; i < chunks.length; i++) {
                const chunk = chunks[i];
                const lats = chunk.map(p => p.lat).join(',');
                const lngs = chunk.map(p => p.lng).join(',');
                
                const url = `https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`;
                
                let success = false;
                let retryCount = 0;
                const maxRetries = 4; // عدد محاولات الإنعاش لكل حزمة في حال الفشل

                // 2. حلقة المحاولة الذاتية الصارمة (Strict Retry Loop)
                while (!success && retryCount < maxRetries) {
                    try {
                        if(currentLang === 'ar') {
                            statusTextElement.innerHTML = `<span style="color:#0ea5e9;">جاري استخراج البيانات (الدقة العالية)...<br>الحزمة ${i + 1} من ${chunks.length}</span><br><span style="font-size:12px; color:#10b981;"><i class="fas fa-shield-alt"></i> بروتوكول الحماية مفعل: يتم سحب البيانات بهدوء لتجنب حظر السيرفر العالمي. (يرجى الانتظار)</span>`;
                        } else {
                            statusTextElement.innerHTML = `<span style="color:#0ea5e9;">Extracting High-Res Data...<br>Chunk ${i + 1} of ${chunks.length}</span><br><span style="font-size:12px; color:#10b981;"><i class="fas fa-shield-alt"></i> Protection active: Extracting slowly to prevent global server ban. (Please wait)</span>`;
                        }

                        const response = await fetch(url);
                        
                        // معالجة قوية لأخطاء الحظر (429 Too Many Requests, 503 Service Unavailable)
                        if (response.status === 429 || response.status === 503) {
                            throw new Error(`Server Block/Busy (Status ${response.status})`);
                        }
                        if (!response.ok) {
                            throw new Error(`HTTP Error ${response.status}`);
                        }

                        const data = await response.json();
                        results.push({ chunk, elevations: data.elevation });
                        success = true; 

                        // 3. تأخير زمني مريح للسيرفر (2000 ملي ثانية / ثانيتين كاملتين) بين الطلبات الناجحة
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        
                    } catch (error) {
                        retryCount++;
                        if (retryCount >= maxRetries) {
                            throw new Error("استنفاد الحد الأقصى للمحاولات بسبب السيرفر أو انقطاع الإنترنت."); 
                        }
                        
                        // إعلام اللجنة بعملية إعادة المحاولة والمكافحة
                        if(currentLang === 'ar') {
                            statusTextElement.innerHTML = `<span style="color:#ef4444;"><i class="fas fa-exclamation-triangle"></i> السيرفر العالمي مزدحم!</span><br><span style="font-size:13px; color:#f59e0b;">جاري تفعيل بروتوكول الإنعاش للحزمة ${i + 1}... (المحاولة ${retryCount} من ${maxRetries})</span>`;
                        } else {
                            statusTextElement.innerHTML = `<span style="color:#ef4444;"><i class="fas fa-exclamation-triangle"></i> Global Server Busy!</span><br><span style="font-size:13px; color:#f59e0b;">Activating retry protocol for Chunk ${i + 1}... (Attempt ${retryCount} of ${maxRetries})</span>`;
                        }
                        
                        // التوقف لفترة "عقاب" أطول (5 ثوانٍ) لإعطاء السيرفر وقتاً كافياً للنسيان قبل المحاولة مجدداً
                        await new Promise(resolve => setTimeout(resolve, 5000));
                    }
                }
            }
            
            // دمج النتائج
            results.forEach(res => {
                for (let i = 0; i < res.chunk.length; i++) {
                    let z = res.elevations[i] !== null ? res.elevations[i].toFixed(2) : "0.00";
                    csv += `${res.chunk[i].lng},${res.chunk[i].lat},${z}\n`;
                }
            });

            return csv;
        }

        // دالة توليد البيانات الوهمية (للجاذبية والمغناطيسية)
        function generateMockGeophysicalData(bounds, type) {
            let csv = "Longitude(X),Latitude(Y),Value(Z)\n";
            const resolutionConfig = document.getElementById('resolution').value;
            let steps = resolutionConfig === 'high' ? 40 : (resolutionConfig === 'medium' ? 25 : 15);
            
            let latStep = (bounds.north - bounds.south) / steps;
            let lngStep = (bounds.east - bounds.west) / steps;

            for (let lat = bounds.south; lat <= bounds.north; lat += latStep) {
                for (let lng = bounds.west; lng <= bounds.east; lng += lngStep) {
                    let zValue = 0;
                    let noise = (Math.random() * 2) - 1;
                    if (type === 'magnetic') {
                        zValue = (Math.sin(lat * 5) * 150) + (Math.cos(lng * 5) * 100) + (noise * 10) + 50;
                    } else if (type === 'gravity') {
                        zValue = -40 + (Math.sin(lat * 3) * 20) + (Math.cos(lng * 2) * 15) + (noise * 2);
                    }
                    csv += `${lng.toFixed(6)},${lat.toFixed(6)},${zValue.toFixed(2)}\n`;
                }
            }
            return csv;
        }

        // ==========================================
        // 5. تحميل الملف والتصدير (File Export)
        // ==========================================
        function downloadCSV() {
            if (!finalCSVData) return;
            
            const dataType = document.getElementById('dataType').value;
            const date = new Date().toISOString().split('T')[0];
            const fileName = `Shandal_GeoData_${dataType}_${date}.csv`;

            const blob = new Blob([finalCSVData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            
            if (link.download !== undefined) { 
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", fileName);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
